<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DeZoPub — propulse ton serveur Discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b12;
    --surface:#12141f;
    --surface-2:#1a1d2b;
    --border:#262a3a;
    --text:#eef0f5;
    --text-dim:#8d93a8;
    --accent:#5865F2;
    --accent-dim:#4552c9;
    --bump:#ff9f1c;
    --bump-dim:#d6810c;
    --good:#57F287;
    --danger:#ff5470;
    --radius:14px;
    --radius-sm:8px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  h1,h2,h3,.brand,.nav-label,.stat-num{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px;}
  img{max-width:100%;display:block;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

  /* ---------- Splash ---------- */
  #splash{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;animation:splashOut .6s ease 1.1s forwards;}
  #splash .mark{font-size:2.5rem;font-weight:700;letter-spacing:-.02em;opacity:0;transform:translateY(14px) scale(.94);animation:markIn .7s cubic-bezier(.2,.8,.2,1) .15s forwards;display:flex;align-items:center;gap:10px;}
  #splash .mark span{color:var(--bump);}
  #splash .sub{color:var(--text-dim);font-size:.85rem;opacity:0;animation:markIn .6s ease .5s forwards;}
  @keyframes markIn{to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none;}}

  /* ---------- Layout ---------- */
  #shell{display:flex;min-height:100vh;}
  #sidebar{width:230px;flex-shrink:0;border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;}
  .brand{display:flex;align-items:center;gap:9px;font-size:1.2rem;font-weight:700;padding:6px 10px 20px;}
  .brand .dot{width:11px;height:11px;border-radius:4px;background:var(--bump);box-shadow:0 0 12px var(--bump);}
  .navlink{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);color:var(--text-dim);font-weight:500;font-size:.93rem;transition:background .15s,color .15s;}
  .navlink svg{width:20px;height:20px;flex-shrink:0;}
  .navlink:hover{background:var(--surface);color:var(--text);}
  .navlink.active{background:var(--surface-2);color:var(--text);}
  .navlink.active svg{color:var(--bump);}
  #sidebar .spacer{flex:1;}
  #sidebar .foot{color:var(--text-dim);font-size:.72rem;padding:8px 12px;line-height:1.5;}
  #main{flex:1;min-width:0;}
  #topbar{position:sticky;top:0;z-index:40;background:rgba(10,11,18,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:12px 22px;}
  #topbar .search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 16px;color:var(--text-dim);}
  #topbar .search input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:.9rem;}
  #topbar .spacer{flex:1;}
  #view{padding:24px 26px 90px;max-width:1300px;}

  /* ---------- Buttons ---------- */
  .btn{border:none;border-radius:999px;padding:9px 18px;font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,filter .15s,background .15s,opacity .15s;}
  .btn:active{transform:scale(.96);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{filter:brightness(1.1);}
  .btn-bump{background:linear-gradient(135deg,var(--bump),#ffb84d);color:#1a1200;}
  .btn-bump:hover{filter:brightness(1.06);}
  .btn-ghost{background:var(--surface-2);color:var(--text);}
  .btn-ghost:hover{background:var(--border);}
  .btn-discord{background:var(--accent);color:#fff;}
  .btn-discord:hover{filter:brightness(1.1);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(255,84,112,.35);}
  .btn-danger:hover{background:rgba(255,84,112,.1);}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;}
  .avatar{border-radius:50%;object-fit:cover;background:var(--surface-2);}
  .userchip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--border);cursor:pointer;}
  .userchip span{font-size:.83rem;font-weight:600;}

  #view h2.section-title{font-size:1.15rem;font-weight:600;margin:0 0 16px;}

  /* ---------- Tag chips / filters ---------- */
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .chip{padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-size:.78rem;font-weight:600;transition:all .15s;}
  .chip:hover{border-color:var(--accent);color:var(--text);}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .sorttabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;margin-bottom:20px;width:fit-content;}
  .sorttabs button{background:none;border:none;color:var(--text-dim);padding:7px 15px;border-radius:999px;font-size:.78rem;font-weight:600;}
  .sorttabs button.active{background:var(--surface-2);color:var(--text);}

  /* ---------- Server cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;opacity:0;transform:translateY(10px);animation:cardIn .45s ease forwards;transition:border-color .2s,transform .2s;}
  @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
  .scard:hover{border-color:var(--accent);transform:translateY(-2px);}
  .scard .head{display:flex;gap:12px;align-items:center;margin-bottom:10px;}
  .scard .icon{width:52px;height:52px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--bump));flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:1.3rem;}
  .scard .name{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .scard .members{font-size:.72rem;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
  .scard .members .dot{width:7px;height:7px;border-radius:50%;background:var(--good);}
  .scard .desc{font-size:.8rem;color:#c4c9d6;line-height:1.5;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em;}
  .scard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .tagpill{font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(88,101,242,.15);color:#a3aefc;letter-spacing:.02em;}
  .scard .foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);}
  .bump-time{font-size:.7rem;color:var(--text-dim);display:flex;align-items:center;gap:4px;}
  .bump-time.fresh{color:var(--bump);font-weight:600;}
  .vote-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--text-dim);font-size:.78rem;font-weight:700;}
  .vote-btn.voted{color:var(--good);}
  .vote-btn svg{width:16px;height:16px;}

  .empty{text-align:center;padding:70px 20px;color:var(--text-dim);}
  .empty .big{font-size:2.2rem;margin-bottom:8px;}

  /* ---------- Detail page ---------- */
  .detail-wrap{max-width:760px;}
  .detail-banner{width:100%;aspect-ratio:5/1.4;min-height:100px;border-radius:var(--radius);background-size:cover;background-position:center;position:relative;overflow:hidden;}
  .detail-head{display:flex;gap:18px;align-items:flex-end;margin:-34px 0 18px 22px;}
  .detail-head .icon{width:88px;height:88px;border-radius:50%;border:4px solid var(--bg);object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--bump));display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#fff;}
  .detail-head h2{margin:0 0 3px;font-size:1.4rem;}
  .detail-head .sub{color:var(--text-dim);font-size:.83rem;}
  .detail-actions{display:flex;gap:10px;margin:0 0 18px 22px;flex-wrap:wrap;}
  .detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;}
  .desc-box{background:var(--surface);border-radius:var(--radius);padding:16px 18px;font-size:.87rem;color:#cfd6db;line-height:1.6;white-space:pre-wrap;margin-bottom:20px;}
  .stat-inline{display:flex;gap:22px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-inline .s{display:flex;flex-direction:column;}
  .stat-inline .s b{font-size:1.2rem;font-family:'Space Grotesk',sans-serif;}
  .stat-inline .s span{font-size:.7rem;color:var(--text-dim);}

  /* ---------- Comments (reviews) ---------- */
  .comments-head{font-size:.95rem;font-weight:700;margin:10px 0 14px;}
  .comment-box{display:flex;gap:12px;margin-bottom:22px;align-items:flex-start;}
  .comment-box img{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--surface-2);}
  .comment-box .field-wrap{flex:1;}
  .comment-box textarea{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.87rem;padding:6px 0;resize:none;outline:none;}
  .comment-box textarea:focus{border-color:var(--accent);}
  .comment-box .actions{display:flex;justify-content:flex-end;margin-top:8px;}
  .no-channel-notice{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:22px;font-size:.85rem;color:var(--text-dim);flex-wrap:wrap;}
  .comment-item{display:flex;gap:12px;margin-bottom:18px;}
  .comment-item img{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--surface-2);}
  .comment-item .c-name{font-size:.83rem;font-weight:700;margin-right:8px;}
  .comment-item .c-time{font-size:.72rem;color:var(--text-dim);}
  .comment-item .c-text{font-size:.86rem;color:#dfe4e8;margin-top:3px;line-height:1.5;white-space:pre-wrap;}
  .comment-item .c-del{background:none;border:none;color:var(--text-dim);font-size:.7rem;margin-top:4px;padding:0;}
  .comment-item .c-del:hover{color:var(--danger);}

  /* ---------- Publish page ---------- */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;max-width:560px;}
  .panel h3{margin:0 0 6px;font-size:1rem;}
  .panel .hint{color:var(--text-dim);font-size:.8rem;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.78rem;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:.88rem;outline:none;font-family:inherit;transition:border-color .15s;}
  .field input:focus,.field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:80px;}
  .guild-pick{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;margin-bottom:6px;}
  .guild-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);cursor:pointer;}
  .guild-opt.selected{border-color:var(--accent);background:rgba(88,101,242,.12);}
  .guild-opt img{width:32px;height:32px;border-radius:50%;background:var(--surface);}
  .guild-opt .n{font-size:.85rem;font-weight:600;flex:1;}
  .guild-opt .own{font-size:.62rem;color:var(--good);font-weight:700;}
  .tagselect{display:flex;flex-wrap:wrap;gap:8px;}
  .cooldown-box{display:flex;align-items:center;gap:10px;background:rgba(255,159,28,.08);border:1px solid rgba(255,159,28,.3);border-radius:var(--radius-sm);padding:12px 14px;font-size:.82rem;color:#ffcf8a;margin-bottom:14px;}

  /* ---------- Mes pubs ---------- */
  .manage-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
  .manage-row:last-child{border-bottom:none;}
  .manage-row .icon{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .manage-row .info{flex:1;min-width:0;}
  .manage-row .info .t{font-size:.85rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .manage-row .info .s{font-size:.72rem;color:var(--text-dim);}
  .manage-row .cd{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;}
  .manage-row .cd.ready{background:rgba(87,242,135,.15);color:var(--good);}
  .manage-row .cd.wait{background:rgba(255,159,28,.15);color:var(--bump);}

  /* ---------- Modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(4,5,10,.72);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:440px;padding:26px;animation:modalIn .28s cubic-bezier(.2,.9,.25,1);position:relative;max-height:86vh;overflow-y:auto;}
  @keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal h3{margin:0 0 6px;font-size:1.15rem;}
  .modal .desc{color:var(--text-dim);font-size:.85rem;margin-bottom:20px;line-height:1.5;}
  .modal-close-x{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-dim);font-size:1.1rem;width:30px;height:30px;border-radius:50%;}
  .modal-close-x:hover{background:var(--surface-2);color:var(--text);}

  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:999px;font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:all .25s ease;z-index:300;display:flex;align-items:center;gap:8px;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast .dot{width:8px;height:8px;border-radius:50%;background:var(--good);}

  #bottomnav{display:none;}
  @media (max-width:860px){
    #sidebar{display:none;}
    #bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(18,20,31,.94);backdrop-filter:blur(10px);border-top:1px solid var(--border);z-index:60;padding-bottom:env(safe-area-inset-bottom);}
    #bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-dim);font-size:.62rem;font-weight:600;}
    #bottomnav a.active{color:var(--bump);}
    #bottomnav svg{width:21px;height:21px;}
    #view{padding:16px 14px 84px;}
    #topbar{padding:10px 14px;}
    #topbar .search{display:none;}
    .detail-head{margin-left:14px;gap:12px;}
    .detail-head .icon{width:70px;height:70px;}
  }
  @media (max-width:480px){
    .grid{grid-template-columns:1fr 1fr;gap:10px;}
    .scard{padding:12px;}
  }
</style>
</head>
<body>

<div id="splash"><div class="mark">DeZo<span>Pub</span></div><div class="sub">propulse ton serveur Discord</div></div>

<div id="shell">
  <aside id="sidebar">
    <div class="brand"><span class="dot"></span>DeZo<span style="color:var(--bump)">Pub</span></div>
    <nav id="navlinks"></nav>
    <div class="spacer"></div>
    <div class="foot">DeZoPub — annuaire de serveurs Discord, par <b>DeZoX</b></div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="Rechercher un serveur…" oninput="State._search=this.value;renderList()">
      </div>
      <div class="spacer"></div>
      <div id="authArea"></div>
    </div>
    <div id="view"></div>
  </div>
</div>

<nav id="bottomnav"></nav>
<div id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
(function(){
"use strict";

const COOLDOWN_MS = 24*60*60*1000;
const TAGS = ['Gaming','Anime','Musique','Communauté','Développement','Art','Éducation','Rôleplay','Streaming','Autre'];

const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  bump:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  discord:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 5.4A17.6 17.6 0 0015.7 4l-.3.5a13 13 0 013.9 1.6 15.6 15.6 0 00-14.5 0A13 13 0 018.7 4.5L8.4 4a17.4 17.4 0 00-4.6 1.4C1 10 .3 14.5.6 18.9a17.7 17.7 0 005.4 2.7l.9-1.4a11 11 0 01-1.7-.8l.4-.3a12.6 12.6 0 0010.8 0l.4.3a11 11 0 01-1.7.8l.9 1.4a17.6 17.6 0 005.4-2.7c.4-5-.8-9.5-3.5-13.5zM8.5 15.9c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.9.9 1.8 2c0 1.1-.8 2-1.8 2zm7 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.9.9 1.8 2c0 1.1-.8 2-1.8 2z"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  members:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>',
};

/* ============================ STORAGE HELPERS ============================ */
async function sGet(key, shared){ try{ const r = await window.storage.get(key, !!shared); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function sSet(key, value, shared){ try{ await window.storage.set(key, JSON.stringify(value), !!shared); return true; }catch(e){ console.error('storage set failed', e); return false; } }
const uid = ()=> Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function fmtNum(n){ n=n||0; if(n>=1000000) return (n/1000000).toFixed(1).replace('.0','')+'M'; if(n>=1000) return (n/1000).toFixed(1).replace('.0','')+'k'; return String(n); }
function timeAgo(ts){ const s=Math.floor((Date.now()-ts)/1000); if(s<60) return "à l'instant"; if(s<3600) return Math.floor(s/60)+' min'; if(s<86400) return Math.floor(s/3600)+' h'; if(s<2592000) return Math.floor(s/86400)+' j'; return Math.floor(s/2592000)+' mois'; }
function fmtDuration(ms){ if(ms<=0) return 'disponible'; const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000); return h>0? `${h}h${m>0?(' '+m+'min'):''}` : `${m} min`; }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; }
function initials(name){ return (name||'?').trim().slice(0,2).toUpperCase(); }
function colorFromString(s){ let h=0; for(let i=0;i<s.length;i++) h = s.charCodeAt(i) + ((h<<5)-h); return `hsl(${Math.abs(h)%360},65%,50%)`; }

/* ============================ STATE ============================ */
const State = {
  ads: [],
  comments: [],
  user: null,        // {discordId, username, avatar, channelName, guilds:[{id,name,icon,owner}]}
  votes: [],
  myAdsView: false,
  _search:'',
  _tagFilter: null,
  _sort: 'recent',
  _selectedGuild: null,
};

/* ============================ LOAD / SAVE ============================ */
async function loadAll(){
  const [ads, comments, user, votes] = await Promise.all([
    sGet('site:ads', true), sGet('site:comments', true), sGet('auth:user', false), sGet('auth:votes', false),
  ]);
  State.ads = ads || [];
  State.comments = comments || [];
  State.user = user || null;
  State.votes = votes || [];
  if(!ads) await sSet('site:ads', [], true);
  if(!comments) await sSet('site:comments', [], true);
}
async function saveAds(){ await sSet('site:ads', State.ads, true); }
async function saveComments(){ await sSet('site:comments', State.comments, true); }
async function saveUser(){ await sSet('auth:user', State.user, false); }
async function saveVotes(){ await sSet('auth:votes', State.votes, false); }

/* ============================ ROUTER ============================ */
window.addEventListener('hashchange', render);
function go(hash){ location.hash = hash; }

/* ============================ NAV ============================ */
function navItems(){
  const items = [{href:'#/', icon:'home', label:'Accueil'}, {href:'#/publier', icon:'bump', label:'Publier'}];
  if(State.user) items.push({href:'#/mes-pubs', icon:'list', label:'Mes pubs'});
  return items;
}
function renderNav(){
  const route = location.hash || '#/';
  const items = navItems();
  document.getElementById('navlinks').innerHTML = items.map(it=>{
    const active = (it.href==='#/' ? (route==='#/'||route==='') : route.startsWith(it.href));
    return `<a class="navlink ${active?'active':''}" href="${it.href}">${ICONS[it.icon]}<span class="nav-label">${it.label}</span></a>`;
  }).join('');
  document.getElementById('bottomnav').innerHTML = items.map(it=>{
    const active = (it.href==='#/' ? (route==='#/'||route==='') : route.startsWith(it.href));
    return `<a class="${active?'active':''}" href="${it.href}">${ICONS[it.icon]}<span>${it.label}</span></a>`;
  }).join('');
}
function renderAuthArea(){
  const el = document.getElementById('authArea');
  if(!State.user){ el.innerHTML = `<button class="btn btn-discord" id="btnDiscordLogin">${ICONS.discord} Se connecter</button>`; document.getElementById('btnDiscordLogin').onclick = openLoginModal; return; }
  el.innerHTML = `<div class="userchip" id="chipUser"><img class="avatar" src="${State.user.avatar}" style="width:26px;height:26px;"><span>${escapeHtml(State.user.channelName||State.user.username)}</span></div>`;
  document.getElementById('chipUser').onclick = openAccountModal;
}

/* ============================ HOME / LIST ============================ */
function guildAvatarHtml(ad, size){
  size = size||52;
  if(ad.guildIcon) return `<img class="icon" src="${ad.guildIcon}" style="width:${size}px;height:${size}px;">`;
  return `<div class="icon" style="width:${size}px;height:${size}px;background:${colorFromString(ad.guildName)}">${initials(ad.guildName)}</div>`;
}

function filteredSortedAds(){
  let list = [...State.ads];
  if(State._search){ const q = State._search.toLowerCase(); list = list.filter(a=> a.guildName.toLowerCase().includes(q) || (a.description||'').toLowerCase().includes(q)); }
  if(State._tagFilter) list = list.filter(a=> (a.tags||[]).includes(State._tagFilter));
  if(State._sort==='recent') list.sort((a,b)=> b.lastBumpAt - a.lastBumpAt);
  else if(State._sort==='votes') list.sort((a,b)=> (b.votes||0)-(a.votes||0));
  else if(State._sort==='az') list.sort((a,b)=> a.guildName.localeCompare(b.guildName));
  return list;
}

function scardHtml(ad, i){
  const voted = State.votes.includes(ad.id);
  const fresh = (Date.now()-ad.lastBumpAt) < 3600000;
  return `<div class="scard" style="animation-delay:${Math.min(i,10)*35}ms" onclick="location.hash='#/serveur/${ad.id}'">
    <div class="head">
      ${guildAvatarHtml(ad)}
      <div style="min-width:0;">
        <div class="name">${escapeHtml(ad.guildName)}</div>
        <div class="members">${ad.memberCount? `<span class="dot"></span>${fmtNum(ad.memberCount)} membres` : 'Membres non précisés'}</div>
      </div>
    </div>
    <p class="desc">${escapeHtml(ad.description||'')}</p>
    <div class="tags">${(ad.tags||[]).slice(0,3).map(t=>`<span class="tagpill">${escapeHtml(t)}</span>`).join('')}</div>
    <div class="foot">
      <span class="bump-time ${fresh?'fresh':''}">${ICONS.bump.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="12" height="12"')} ${fresh?'Bumpé à l’instant':'Bumpé il y a '+timeAgo(ad.lastBumpAt)}</span>
      <button class="vote-btn ${voted?'voted':''}" onclick="event.stopPropagation();toggleVote('${ad.id}')">${ICONS.arrow} ${fmtNum(ad.votes)}</button>
    </div>
  </div>`;
}

function viewHome(){
  const list = filteredSortedAds();
  const header = `
    <div class="sorttabs">
      <button class="${State._sort==='recent'?'active':''}" onclick="State._sort='recent';renderList()">🔥 Récents</button>
      <button class="${State._sort==='votes'?'active':''}" onclick="State._sort='votes';renderList()">⭐ Les plus votés</button>
      <button class="${State._sort==='az'?'active':''}" onclick="State._sort='az';renderList()">A–Z</button>
    </div>
    <div class="chiprow" id="tagChips">
      <button class="chip ${!State._tagFilter?'active':''}" onclick="State._tagFilter=null;renderList()">Tous</button>
      ${TAGS.map(t=>`<button class="chip ${State._tagFilter===t?'active':''}" onclick="State._tagFilter='${t}';renderList()">${t}</button>`).join('')}
    </div>
    <div id="adsGrid"></div>
  `;
  return header;
}
function renderList(){
  const grid = document.getElementById('adsGrid');
  const chips = document.getElementById('tagChips');
  if(!grid) return; // not on home
  const list = filteredSortedAds();
  grid.innerHTML = list.length ? `<div class="grid">${list.map(scardHtml).join('')}</div>` : emptyState('📡','Aucun serveur ne correspond','Essaie une autre recherche ou un autre tag.');
  if(chips) chips.querySelectorAll('.chip').forEach(c=>{});
  // refresh active states on sorttabs/chips without full rerender
  document.querySelectorAll('.sorttabs button').forEach((b,idx)=>{ b.classList.toggle('active', ['recent','votes','az'][idx]===State._sort); });
  document.querySelectorAll('#tagChips .chip').forEach((b,idx)=>{ const val = idx===0? null : TAGS[idx-1]; b.classList.toggle('active', State._tagFilter===val); });
}

function emptyState(emoji,title,sub){ return `<div class="empty"><div class="big">${emoji}</div><h3 style="margin:0 0 6px;">${title}</h3><p>${sub}</p></div>`; }

/* ============================ DETAIL ============================ */
function viewDetail(id){
  const ad = State.ads.find(a=>a.id===id);
  if(!ad) return emptyState('❓','Serveur introuvable','Cette pub a peut-être expiré ou a été supprimée.');
  const voted = State.votes.includes(ad.id);
  const isMine = State.user && ad.authorDiscordId===State.user.discordId;
  const bg = ad.guildIcon ? `background-image:url(${ad.guildIcon});filter:blur(18px) brightness(.5);transform:scale(1.2);` : `background:linear-gradient(120deg,${colorFromString(ad.guildName)},var(--surface-2));`;
  return `<div class="detail-wrap">
    <div class="detail-banner" style="${bg}"></div>
    <div class="detail-head">${guildAvatarHtml(ad,88)}<div><h2>${escapeHtml(ad.guildName)}</h2><div class="sub">${ad.memberCount? fmtNum(ad.memberCount)+' membres · ':''}Bumpé il y a ${timeAgo(ad.lastBumpAt)}</div></div></div>
    <div class="detail-actions">
      <a class="btn btn-accent" href="${ad.inviteLink}" target="_blank" rel="noopener">${ICONS.discord} Rejoindre le serveur</a>
      <button class="vote-btn ${voted?'voted':''}" style="background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 16px;" onclick="toggleVote('${ad.id}')">${ICONS.arrow} ${fmtNum(ad.votes)} votes</button>
      ${isMine? `<a class="btn btn-ghost" href="#/publier">Re-bump ce serveur</a>` : ''}
    </div>
    <div class="detail-tags">${(ad.tags||[]).map(t=>`<span class="tagpill">${escapeHtml(t)}</span>`).join('')}</div>
    <div class="stat-inline">
      <div class="s"><b>${fmtNum(ad.bumpCount||1)}</b><span>bumps</span></div>
      <div class="s"><b>${fmtNum(ad.votes)}</b><span>votes</span></div>
      <div class="s"><b>${State.comments.filter(c=>c.targetId===ad.id).length}</b><span>avis</span></div>
    </div>
    <div class="desc-box">${escapeHtml(ad.description||'Pas de description.')}</div>
    ${commentsHtml(ad.id)}
  </div>`;
}

/* ============================ COMMENTS ============================ */
function commentsHtml(targetId){
  const list = State.comments.filter(c=>c.targetId===targetId).sort((a,b)=>b.createdAt-a.createdAt);
  let box;
  if(!State.user){
    box = `<div class="no-channel-notice">${ICONS.discord}<span>Connecte-toi avec Discord pour laisser un avis.</span><button class="btn btn-discord" style="margin-left:auto;" onclick="openLoginModal()">Se connecter</button></div>`;
  } else if(!State.user.channelName){
    box = `<div class="no-channel-notice"><span>Choisis un pseudo public pour pouvoir commenter.</span><button class="btn btn-accent" style="margin-left:auto;" onclick="openChannelModal()">Configurer</button></div>`;
  } else {
    box = `<div class="comment-box"><img src="${State.user.avatar}"><div class="field-wrap"><textarea id="commentInput" rows="1" placeholder="Donne ton avis sur ce serveur…" oninput="this.rows=this.value.split('\\n').length"></textarea><div class="actions"><button class="btn btn-accent" onclick="postComment('${targetId}')">Publier</button></div></div></div>`;
  }
  const items = list.length ? list.map(c=>`
    <div class="comment-item"><img src="${c.avatar}"><div><span class="c-name">${escapeHtml(c.name)}</span><span class="c-time">${timeAgo(c.createdAt)}</span><div class="c-text">${escapeHtml(c.text)}</div>${(State.user && State.user.discordId===c.authorId)?`<button class="c-del" onclick="deleteComment('${c.id}')">Supprimer</button>`:''}</div></div>`).join('')
    : `<p style="color:var(--text-dim);font-size:.83rem;">Aucun avis pour l'instant.</p>`;
  return `<div class="comments-head">${list.length} avis</div>${box}${items}`;
}
window.postComment = async function(targetId){
  const ta = document.getElementById('commentInput'); const text = ta.value.trim(); if(!text) return;
  State.comments.push({ id:uid(), targetId, authorId:State.user.discordId, name:State.user.channelName, avatar:State.user.avatar, text, createdAt:Date.now() });
  await saveComments(); render();
};
window.deleteComment = async function(id){ State.comments = State.comments.filter(c=>c.id!==id); await saveComments(); toast('Avis supprimé'); render(); };

/* ============================ VOTES ============================ */
window.toggleVote = async function(id){
  if(!State.user){ openLoginModal(); return; }
  const ad = State.ads.find(a=>a.id===id); if(!ad) return;
  const has = State.votes.includes(id);
  if(has){ State.votes = State.votes.filter(x=>x!==id); ad.votes = Math.max(0,(ad.votes||0)-1); }
  else { State.votes.push(id); ad.votes = (ad.votes||0)+1; }
  await saveVotes(); await saveAds();
  if(location.hash.startsWith('#/serveur/')) render(); else renderList();
};

/* ============================ PUBLISH ============================ */
function myGuildAds(guildId){ return State.ads.find(a=>a.guildId===guildId); }
function cooldownRemaining(guildId){
  const ad = myGuildAds(guildId);
  if(!ad) return 0;
  return COOLDOWN_MS - (Date.now()-ad.lastBumpAt);
}

function viewPublish(){
  if(!State.user) return emptyState('🔒','Connecte-toi pour publier','Utilise ton compte Discord pour proposer ou bumper un serveur.');
  const guilds = State.user.guilds || [];
  const selectedId = State._selectedGuild;
  const selected = guilds.find(g=>g.id===selectedId);
  const remaining = selectedId ? cooldownRemaining(selectedId) : 0;
  const existingAd = selectedId ? myGuildAds(selectedId) : null;

  return `
    <h2 class="section-title">Publier / Bumper un serveur</h2>
    <div class="panel">
      <h3>1. Choisis ton serveur</h3>
      <p class="hint">Seuls les serveurs où tu es propriétaire ou administrateur apparaissent ici (détecté via ta connexion Discord).</p>
      ${guilds.length ? `<div class="guild-pick">${guilds.map(g=>`
        <div class="guild-opt ${g.id===selectedId?'selected':''}" onclick="State._selectedGuild='${g.id}';render()">
          <img src="${g.icon||''}" onerror="this.style.visibility='hidden'">
          <span class="n">${escapeHtml(g.name)}</span>
          ${g.owner?'<span class="own">PROPRIÉTAIRE</span>':''}
        </div>`).join('')}</div>` : `<p class="hint" style="color:var(--danger);">Aucun serveur détecté où tu as les droits d'administration. Reconnecte-toi pour rafraîchir la liste.</p>`}
    </div>

    ${selected ? `
    <div class="panel">
      <h3>2. Détails de la pub</h3>
      ${remaining>0 ? `<div class="cooldown-box">⏳ Ce serveur a déjà été bumpé récemment. Prochain bump possible dans <b>${fmtDuration(remaining)}</b>.</div>` : ''}
      <div class="field"><label>Description</label><textarea id="pubDesc" placeholder="Présente ton serveur en quelques lignes…">${existingAd?escapeHtml(existingAd.description):''}</textarea></div>
      <div class="field"><label>Lien d'invitation Discord</label><input type="text" id="pubInvite" placeholder="https://discord.gg/xxxxxxx" value="${existingAd?escapeHtml(existingAd.inviteLink):''}"></div>
      <div class="field"><label>Nombre de membres (optionnel)</label><input type="number" id="pubMembers" min="0" value="${existingAd?existingAd.memberCount||'':''}"></div>
      <div class="field"><label>Tags (jusqu'à 3)</label><div class="tagselect" id="tagSelect">${TAGS.map(t=>`<button type="button" class="chip ${((existingAd&&existingAd.tags||[]).includes(t))?'active':''}" data-tag="${t}" onclick="toggleTagChip(this)">${t}</button>`).join('')}</div></div>
      <button class="btn btn-bump" id="btnPublish" ${remaining>0?'disabled':''} style="width:100%;justify-content:center;">${ICONS.bump} ${existingAd? 'Bumper ce serveur' : 'Publier la pub'}</button>
    </div>` : ''}
  `;
}
window.toggleTagChip = function(btn){
  const active = btn.classList.contains('active');
  const current = document.querySelectorAll('#tagSelect .chip.active').length;
  if(!active && current>=3){ toast('3 tags maximum'); return; }
  btn.classList.toggle('active');
};

function wirePublishEvents(){
  const btn = document.getElementById('btnPublish');
  if(!btn) return;
  btn.onclick = async ()=>{
    const guildId = State._selectedGuild;
    const guild = (State.user.guilds||[]).find(g=>g.id===guildId);
    if(cooldownRemaining(guildId) > 0){ toast('Ce serveur ne peut pas encore être re-bumpé'); return; }
    const desc = document.getElementById('pubDesc').value.trim();
    const invite = document.getElementById('pubInvite').value.trim();
    const members = parseInt(document.getElementById('pubMembers').value,10) || null;
    const tags = Array.from(document.querySelectorAll('#tagSelect .chip.active')).map(b=>b.dataset.tag);
    if(!desc){ toast('Ajoute une description'); return; }
    if(!invite || !invite.includes('discord.gg') && !invite.includes('discord.com/invite')){ toast('Ajoute un lien d’invitation Discord valide'); return; }
    let ad = myGuildAds(guildId);
    const now = Date.now();
    if(ad){
      ad.description=desc; ad.inviteLink=invite; ad.memberCount=members; ad.tags=tags;
      ad.lastBumpAt=now; ad.bumpCount=(ad.bumpCount||1)+1;
      ad.guildName=guild.name; ad.guildIcon=guild.icon;
    } else {
      ad = { id:uid(), guildId, guildName:guild.name, guildIcon:guild.icon, description:desc, inviteLink:invite,
        memberCount:members, tags, votes:0, bumpCount:1, authorDiscordId:State.user.discordId,
        authorName:State.user.channelName, createdAt:now, lastBumpAt:now };
      State.ads.push(ad);
    }
    await saveAds();
    toast(ad.bumpCount>1 ? 'Serveur bumpé 🚀' : 'Pub publiée 🚀');
    go('#/serveur/'+ad.id);
  };
}

/* ============================ MES PUBS ============================ */
function viewMyAds(){
  if(!State.user) return emptyState('🔒','Connecte-toi','Connecte-toi pour voir tes pubs.');
  const mine = State.ads.filter(a=>a.authorDiscordId===State.user.discordId).sort((a,b)=>b.lastBumpAt-a.lastBumpAt);
  if(!mine.length) return emptyState('📭','Aucune pub encore','Publie ton premier serveur depuis l’onglet "Publier".');
  return `<h2 class="section-title">Mes pubs</h2>${mine.map(ad=>{
    const remaining = cooldownRemaining(ad.guildId);
    return `<div class="panel" style="cursor:default;">
      <div class="manage-row">
        ${guildAvatarHtml(ad,44).replace('class="icon"','class="icon" style="width:44px;height:44px;"')}
        <div class="info"><div class="t">${escapeHtml(ad.guildName)}</div><div class="s">${fmtNum(ad.votes)} votes · ${ad.bumpCount||1} bumps · dernier bump il y a ${timeAgo(ad.lastBumpAt)}</div></div>
        <span class="cd ${remaining>0?'wait':'ready'}">${remaining>0? fmtDuration(remaining) : 'Bump dispo'}</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <a class="btn btn-ghost" style="font-size:.78rem;padding:7px 14px;" href="#/serveur/${ad.id}">Voir la pub</a>
        <button class="btn btn-danger" style="font-size:.78rem;padding:7px 14px;" onclick="deleteAd('${ad.id}')">Supprimer</button>
      </div>
    </div>`;
  }).join('')}`;
}
window.deleteAd = async function(id){
  State.ads = State.ads.filter(a=>a.id!==id);
  await saveAds(); toast('Pub supprimée'); render();
};

/* ============================ AUTH MODALS ============================ */
function openModal(html){
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.innerHTML = html;
  bg.addEventListener('click',(e)=>{ if(e.target===bg) closeModal(); });
  document.body.appendChild(bg); return bg;
}
function closeModal(){ document.querySelectorAll('.modal-bg').forEach(el=>el.remove()); }

function makeAvatarDataUrl(seedText){
  const emojiSet=['🦊','🐼','🐸','🐨','🦉','🐯','🐙','🦁','🐺','🐧'];
  const emoji = emojiSet[Math.abs(seedText.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%emojiSet.length];
  const bg = colorFromString(seedText);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="${bg}"/><text x="50%" y="54%" font-size="60" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function openLoginModal(){
  const modal = openModal(`
    <div class="modal">
      <button class="modal-close-x" onclick="closeModal()">✕</button>
      <div style="width:44px;height:44px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:14px;">${ICONS.discord}</div>
      <h3>Connexion avec Discord</h3>
      <p class="desc">Connecte-toi pour publier ou bumper un serveur (on détecte automatiquement ceux où tu es admin), voter et laisser des avis.</p>
      <a class="btn btn-discord" href="/auth/discord" style="width:100%;justify-content:center;box-sizing:border-box;">${ICONS.discord} Se connecter avec Discord</a>
    </div>
  `);
}

function openChannelModal(){
  const modal = openModal(`
    <div class="modal">
      <button class="modal-close-x" onclick="closeModal()">✕</button>
      <h3>Ton pseudo public</h3>
      <p class="desc">Visible sur tes avis et tes pubs.</p>
      <div class="field"><label>Pseudo</label><input type="text" id="channelNameInput" value="${State.user?escapeHtml(State.user.username):''}"></div>
      <button class="btn btn-accent" id="btnSaveChannel" style="width:100%;justify-content:center;">Valider</button>
    </div>`);
  modal.querySelector('#btnSaveChannel').onclick = async ()=>{
    const name = modal.querySelector('#channelNameInput').value.trim();
    if(!name){ toast('Choisis un pseudo'); return; }
    State.user.channelName = name;
    await saveUser(); toast('Pseudo enregistré ✓'); closeModal(); render();
  };
}

function openAccountModal(){
  const modal = openModal(`
    <div class="modal">
      <button class="modal-close-x" onclick="closeModal()">✕</button>
      <div style="text-align:center;">
        <img src="${State.user.avatar}" style="width:64px;height:64px;border-radius:50%;margin-bottom:10px;">
        <h3>${escapeHtml(State.user.channelName||State.user.username)}</h3>
        <p class="desc">${(State.user.guilds||[]).length} serveur(s) détecté(s) où tu es admin</p>
      </div>
      <a class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:10px;" href="#/mes-pubs" onclick="closeModal()">Voir mes pubs</a>
      <button class="btn btn-danger" style="width:100%;justify-content:center;" id="btnLogout">Se déconnecter</button>
    </div>`);
  modal.querySelector('#btnLogout').onclick = async ()=>{
    State.user = null; await saveUser(); closeModal(); toast('Déconnecté');
    if(location.hash.startsWith('#/publier')||location.hash.startsWith('#/mes-pubs')) go('#/');
    render();
  };
}

/* ============================ REAL DISCORD OAUTH RETURN ============================ */
async function consumeDiscordAuthFromUrl(){
  const params = new URLSearchParams(location.search);
  const raw = params.get('discordAuth');
  if(!raw) return;
  try{
    const data = JSON.parse(decodeURIComponent(raw));
    State.user = {
      discordId: data.discordId, username: data.username, avatar: data.avatar,
      channelName: (State.user && State.user.discordId===data.discordId) ? State.user.channelName : data.username,
      guilds: data.guilds || [],
    };
    await saveUser();
    toast('Connecté avec Discord ✓');
  }catch(e){ console.error('discordAuth parse error', e); }
  history.replaceState(null, '', location.pathname + location.hash);
}

/* ============================ MAIN RENDER ============================ */
let _tickHandle = null;
function render(){
  renderNav(); renderAuthArea();
  const hash = location.hash || '#/';
  const view = document.getElementById('view');
  let html = '';
  if(hash==='#/') html = viewHome();
  else if(hash.startsWith('#/serveur/')) html = viewDetail(hash.split('#/serveur/')[1]);
  else if(hash.startsWith('#/publier')) html = viewPublish();
  else if(hash.startsWith('#/mes-pubs')) html = viewMyAds();
  else html = viewHome();
  view.innerHTML = html;
  if(hash==='#/'||hash==='') renderList();
  if(hash.startsWith('#/publier')) wirePublishEvents();
  clearInterval(_tickHandle);
  if(hash.startsWith('#/mes-pubs')) _tickHandle = setInterval(render, 60000);
  window.scrollTo(0,0);
}

/* ============================ INIT ============================ */
(async function init(){
  await loadAll();
  await consumeDiscordAuthFromUrl();
  render();
  setTimeout(()=>{ const s=document.getElementById('splash'); if(s) s.remove(); }, 1700);
})();

})();
</script>
</body>
