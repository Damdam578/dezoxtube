<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DeZoTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f14;
    --surface:#111820;
    --surface-2:#1a2330;
    --border:#232e3b;
    --text:#edeff2;
    --text-dim:#8fa0ac;
    --accent:#ff6b35;
    --accent-dim:#c9541f;
    --good:#3ddc97;
    --discord:#5865F2;
    --danger:#ff5470;
    --radius:14px;
    --radius-sm:8px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.brand,.nav-label,.stat-num{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px;}
  img,video{max-width:100%;display:block;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Intro splash ---------- */
  #splash{
    position:fixed;inset:0;background:var(--bg);z-index:999;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    animation: splashOut 0.6s ease 1.15s forwards;
  }
  #splash .mark{
    font-size:2.6rem;font-weight:700;letter-spacing:-0.02em;
    opacity:0;transform:translateY(14px) scale(.94);
    animation: markIn 0.7s cubic-bezier(.2,.8,.2,1) 0.15s forwards;
  }
  #splash .mark span{color:var(--accent);}
  #splash .sub{color:var(--text-dim);font-size:.85rem;opacity:0;animation:markIn .6s ease .5s forwards;}
  @keyframes markIn{to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none;}}

  /* ---------- Layout shell ---------- */
  #shell{display:flex;min-height:100vh;}
  #sidebar{
    width:220px;flex-shrink:0;border-right:1px solid var(--border);
    padding:18px 14px;position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;gap:4px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:1.25rem;font-weight:700;padding:6px 10px 22px;}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
  .navlink{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);
    color:var(--text-dim);font-weight:500;font-size:.93rem;transition:background .15s,color .15s;
  }
  .navlink svg{width:20px;height:20px;flex-shrink:0;}
  .navlink:hover{background:var(--surface);color:var(--text);}
  .navlink.active{background:var(--surface-2);color:var(--text);}
  .navlink.active svg{color:var(--accent);}
  #sidebar .spacer{flex:1;}
  #sidebar .foot{color:var(--text-dim);font-size:.72rem;padding:8px 12px;line-height:1.5;}

  #main{flex:1;min-width:0;}
  #topbar{
    position:sticky;top:0;z-index:40;background:rgba(10,15,20,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:14px;padding:12px 22px;
  }
  #topbar .search{
    flex:1;max-width:520px;display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 16px;
    color:var(--text-dim);
  }
  #topbar .search input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:.9rem;}
  #topbar .spacer{flex:1;}
  #topbar .search-icon{flex-shrink:0;}

  .btn{
    border:none;border-radius:999px;padding:9px 18px;font-weight:600;font-size:.85rem;
    display:inline-flex;align-items:center;gap:8px;transition:transform .15s, filter .15s, background .15s;
  }
  .btn:active{transform:scale(.96);}
  .btn-accent{background:var(--accent);color:#12100e;}
  .btn-accent:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--surface-2);color:var(--text);}
  .btn-ghost:hover{background:var(--border);}
  .btn-discord{background:var(--discord);color:#fff;}
  .btn-discord:hover{filter:brightness(1.1);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(255,84,112,.35);}
  .btn-danger:hover{background:rgba(255,84,112,.1);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .avatar{border-radius:50%;object-fit:cover;background:var(--surface-2);}
  .userchip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--border);}
  .userchip span{font-size:.83rem;font-weight:600;}
  .owner-badge{background:var(--accent);color:#12100e;font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:2px;letter-spacing:.02em;}

  #view{padding:24px 26px 90px;max-width:1400px;}

  /* ---------- Video grid ---------- */
  .section-title{font-size:1.15rem;font-weight:600;margin:0 0 16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;}
  .card{
    cursor:pointer;opacity:0;transform:translateY(10px);animation:cardIn .5s ease forwards;
  }
  @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
  .thumb-wrap{
    position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:var(--surface-2);
    transition:transform .25s ease;
  }
  .card:hover .thumb-wrap{transform:scale(1.025);}
  .thumb-wrap img,.thumb-wrap .thumb-fallback{width:100%;height:100%;object-fit:cover;}
  .thumb-fallback{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--surface-2),var(--surface));color:var(--text-dim);font-size:2rem;}
  .badge-short{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:.65rem;font-weight:700;padding:3px 7px;border-radius:6px;letter-spacing:.03em;}
  .card .meta{display:flex;gap:10px;margin-top:10px;}
  .card .meta img{width:34px;height:34px;border-radius:50%;flex-shrink:0;}
  .card .title{font-size:.9rem;font-weight:600;line-height:1.35;margin:0 0 4px;}
  .card .sub{font-size:.78rem;color:var(--text-dim);}

  .empty{
    text-align:center;padding:70px 20px;color:var(--text-dim);
  }
  .empty .big{font-size:2.2rem;margin-bottom:8px;}
  .skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;}
  @keyframes shimmer{to{background-position:-200% 0;}}

  /* ---------- Shorts feed ---------- */
  #shortsFeed{
    height:calc(100vh - 66px);overflow-y:auto;scroll-snap-type:y mandatory;
    display:flex;flex-direction:column;gap:14px;padding:14px 0;
  }
  .short-slide{
    scroll-snap-align:center;height:calc(100vh - 94px);max-height:780px;
    display:flex;align-items:center;justify-content:center;
  }
  .short-card{
    position:relative;width:min(360px,88vw);height:100%;border-radius:20px;overflow:hidden;
    background:var(--surface);border:1px solid var(--border);
  }
  .short-card video,.short-card img{width:100%;height:100%;object-fit:cover;}
  .short-overlay{position:absolute;left:0;right:0;bottom:0;padding:18px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent 65%);}
  .short-overlay .title{font-weight:600;font-size:.95rem;margin-bottom:4px;}
  .short-overlay .sub{font-size:.78rem;color:#cfd6db;}
  .short-actions{position:absolute;right:10px;bottom:70px;display:flex;flex-direction:column;gap:18px;align-items:center;}
  .short-actions button{background:rgba(0,0,0,.45);border:none;color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
  .short-actions .cnt{font-size:.68rem;color:#fff;margin-top:-10px;}

  /* ---------- Watch page ---------- */
  .watch-wrap{max-width:960px;}
  .player{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .player video{width:100%;height:100%;}
  .watch-title{font-size:1.25rem;font-weight:700;margin:16px 0 8px;}
  .watch-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .channel-line{display:flex;align-items:center;gap:12px;}
  .channel-line img{width:44px;height:44px;border-radius:50%;}
  .channel-line .name{font-weight:600;font-size:.95rem;}
  .channel-line .subs{font-size:.75rem;color:var(--text-dim);}
  .action-row{display:flex;gap:10px;}
  .pill-group{display:flex;background:var(--surface);border-radius:999px;overflow:hidden;border:1px solid var(--border);}
  .pill-group button{background:none;border:none;color:var(--text);padding:9px 16px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:6px;}
  .pill-group button.liked{color:var(--good);}
  .pill-group .divider{width:1px;background:var(--border);}
  .desc-box{background:var(--surface);border-radius:var(--radius);padding:14px 16px;font-size:.87rem;color:#cfd6db;line-height:1.55;white-space:pre-wrap;}

  /* ---------- Comments ---------- */
  .comments-head{font-size:.95rem;font-weight:700;margin:26px 0 14px;}
  .comment-box{display:flex;gap:12px;margin-bottom:22px;align-items:flex-start;}
  .comment-box img{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--surface-2);}
  .comment-box .field-wrap{flex:1;}
  .comment-box textarea{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.87rem;padding:6px 0;resize:none;outline:none;transition:border-color .15s;}
  .comment-box textarea:focus{border-color:var(--accent);}
  .comment-box .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
  .no-channel-notice{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:22px;font-size:.85rem;color:var(--text-dim);
  }
  .comment-item{display:flex;gap:12px;margin-bottom:18px;animation:cardIn .35s ease;}
  .comment-item img{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--surface-2);}
  .comment-item .c-name{font-size:.83rem;font-weight:700;margin-right:8px;}
  .comment-item .c-time{font-size:.72rem;color:var(--text-dim);}
  .comment-item .c-text{font-size:.86rem;color:#dfe4e8;margin-top:3px;line-height:1.5;white-space:pre-wrap;}
  .comment-item .c-del{background:none;border:none;color:var(--text-dim);font-size:.7rem;margin-top:4px;padding:0;}
  .comment-item .c-del:hover{color:var(--danger);}

  /* ---------- Channel page ---------- */
  .banner{width:100%;aspect-ratio:6/1;min-height:120px;border-radius:var(--radius);background:linear-gradient(120deg,var(--surface-2),var(--surface));object-fit:cover;}
  .channel-head{display:flex;align-items:flex-end;gap:18px;margin:-38px 0 20px 24px;}
  .channel-head img{width:96px;height:96px;border-radius:50%;border:4px solid var(--bg);background:var(--surface-2);}
  .channel-head .info h2{margin:0 0 2px;font-size:1.4rem;}
  .channel-head .info .sub{color:var(--text-dim);font-size:.85rem;}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .tab{padding:11px 6px;font-size:.9rem;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;margin-right:18px;}
  .tab.active{color:var(--text);border-color:var(--accent);}

  /* ---------- Modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(4,6,8,.7);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:420px;
    padding:26px;animation:modalIn .28s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .modal h3{margin:0 0 6px;font-size:1.15rem;}
  .modal .desc{color:var(--text-dim);font-size:.85rem;margin-bottom:20px;line-height:1.5;}
  .modal .close{position:absolute;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.78rem;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .field input[type=text], .field textarea, .field select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 12px;color:var(--text);font-size:.88rem;outline:none;font-family:inherit;transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:70px;}
  .dz-drop{
    border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:22px 14px;text-align:center;
    color:var(--text-dim);font-size:.82rem;cursor:pointer;transition:border-color .15s,background .15s;position:relative;
  }
  .dz-drop:hover{border-color:var(--accent);background:rgba(255,107,53,.05);}
  .dz-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .dz-drop.has-file{border-color:var(--good);color:var(--good);}
  .type-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .type-toggle button{flex:1;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-weight:600;font-size:.85rem;}
  .type-toggle button.active{background:var(--accent);color:#12100e;border-color:var(--accent);}

  .modal-close-x{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-dim);font-size:1.1rem;width:30px;height:30px;border-radius:50%;}
  .modal-close-x:hover{background:var(--surface-2);color:var(--text);}
  .modal-wrap{position:relative;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:12px 20px;
    border-radius:999px;font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:all .25s ease;z-index:300;
    display:flex;align-items:center;gap:8px;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast .dot{width:8px;height:8px;border-radius:50%;background:var(--good);}

  /* ---------- Dashboard ---------- */
  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .stat-card .lbl{font-size:.75rem;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .stat-num{font-size:1.7rem;font-weight:700;}
  .stat-num.accent{color:var(--accent);}
  .stat-num.good{color:var(--good);}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:22px;}
  .panel h3{margin:0 0 14px;font-size:1rem;}
  .bar-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;}
  .bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .bar-chart .bar{width:100%;background:linear-gradient(180deg,var(--accent),var(--accent-dim));border-radius:6px 6px 2px 2px;min-height:4px;transition:height .5s cubic-bezier(.2,.8,.2,1);}
  .bar-chart .bar-lbl{font-size:.68rem;color:var(--text-dim);text-align:center;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .manage-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .manage-row:last-child{border-bottom:none;}
  .manage-row img{width:64px;height:38px;border-radius:6px;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .manage-row .info{flex:1;min-width:0;}
  .manage-row .info .t{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .manage-row .info .s{font-size:.72rem;color:var(--text-dim);}
  .profile-edit-row{display:flex;gap:24px;flex-wrap:wrap;}
  .edit-block{flex:1;min-width:220px;}
  .edit-block .lbl{font-size:.78rem;color:var(--text-dim);margin-bottom:8px;font-weight:600;}
  .edit-banner-prev{width:100%;aspect-ratio:6/1;border-radius:10px;object-fit:cover;background:var(--surface-2);margin-bottom:8px;}
  .edit-avatar-prev{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--surface-2);margin-bottom:8px;}

  /* ---------- Mobile ---------- */
  #bottomnav{display:none;}
  @media (max-width: 860px){
    #sidebar{display:none;}
    #bottomnav{
      display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(17,24,32,.92);
      backdrop-filter:blur(10px);border-top:1px solid var(--border);z-index:60;
      padding-bottom:env(safe-area-inset-bottom);
    }
    #bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-dim);font-size:.62rem;font-weight:600;}
    #bottomnav a.active{color:var(--accent);}
    #bottomnav svg{width:21px;height:21px;}
    #view{padding:16px 14px 84px;}
    #topbar{padding:10px 14px;}
    #topbar .search{display:none;}
    .channel-head{margin-left:14px;gap:12px;}
    .channel-head img{width:72px;height:72px;}
    .short-slide{height:calc(100vh - 140px);}
    #shortsFeed{height:calc(100vh - 130px);}
  }
  @media (max-width: 480px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
    .stat-cards{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div id="splash"><div class="mark">DeZo<span>Tube</span></div><div class="sub">ta chaîne, tes règles</div></div>

<div id="shell">
  <aside id="sidebar">
    <div class="brand"><span class="dot"></span>DeZo<span style="color:var(--accent)">Tube</span></div>
    <nav id="navlinks"></nav>
    <div class="spacer"></div>
    <div class="foot">DeZoTube — plateforme perso de <b>DeZoX</b></div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div class="search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="Rechercher une vidéo…">
      </div>
      <div class="spacer"></div>
      <div id="authArea"></div>
    </div>
    <div id="view"></div>
  </div>
</div>

<nav id="bottomnav"></nav>
<div id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
(function(){
"use strict";

/* ============================ ICONS ============================ */
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  shorts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 9l4 3-4 3z" fill="currentColor" stroke="none"/></svg>',
  channel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 19v-6h4v6"/></svg>',
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l4-4 4 4 6-8 4 4"/></svg>',
  eye:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  heart:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',

/* ============================ STORAGE HELPERS ============================ */
async function sGet(key, shared){
  try{ const r = await window.storage.get(key, !!shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), !!shared); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}

const uid = ()=> Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

function fmtNum(n){
  n = n||0;
  if(n>=1000000) return (n/1000000).toFixed(1).replace('.0','')+'M';
  if(n>=1000) return (n/1000).toFixed(1).replace('.0','')+'k';
  return String(n);
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "à l'instant";
  if(s<3600) return Math.floor(s/60)+' min';
  if(s<86400) return Math.floor(s/3600)+' h';
  if(s<2592000) return Math.floor(s/86400)+' j';
  return Math.floor(s/2592000)+' mois';
}
function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML;
}

/* ============================ APP STATE ============================ */
const State = {
  profile: null,       // {name, avatar, banner, about, ownerDiscordId}
  videos: [],           // shared list
  user: null,           // {discordId, username, channelName, avatar} - personal (this browser)
  likes: [],             // personal array of video ids liked
  subscribed: false,    // personal
  comments: [],          // shared list {id, videoId, authorId, name, avatar, text, createdAt}
  route: '#/',
};

function isOwner(){
  return !!(State.user && State.profile && State.profile.ownerDiscordId && State.user.discordId === State.profile.ownerDiscordId);
}

const DEFAULT_PROFILE = {
  name: 'DeZoX',
  avatar: '',
  banner: '',
  about: "Bienvenue sur ma chaîne — je poste ici mes vidéos et mes shorts. Abonne-toi pour ne rien manquer !",
  ownerDiscordId: null,
};

/* ============================ LOAD / SAVE ============================ */
async function loadAll(){
  const [profile, videos, user, likes, subInfo, comments] = await Promise.all([
    sGet('channel:profile', true),
    sGet('channel:videos', true),
    sGet('auth:user', false),
    sGet('auth:likes', false),
    sGet('channel:subscribers', true),
    sGet('channel:comments', true),
  ]);
  State.profile = profile || DEFAULT_PROFILE;
  State.videos = videos || [];
  State.user = user || null;
  State.likes = likes || [];
  State.comments = comments || [];
  const subs = subInfo || [];
  State.subsList = subs;
  State.subscribed = !!(State.user && subs.includes(State.user.discordId));
  if(!videos) await sSet('channel:videos', [], true);
  if(!profile) await sSet('channel:profile', DEFAULT_PROFILE, true);
  if(!comments) await sSet('channel:comments', [], true);
}

async function saveProfile(){ await sSet('channel:profile', State.profile, true); }
async function saveVideos(){ await sSet('channel:videos', State.videos, true); }
async function saveUser(){ await sSet('auth:user', State.user, false); }
async function saveLikes(){ await sSet('auth:likes', State.likes, false); }
async function saveSubs(){ await sSet('channel:subscribers', State.subsList, true); }
async function saveComments(){ await sSet('channel:comments', State.comments, true); }

window.postComment = async function(videoId){
  const ta = document.getElementById('commentInput');

  State.comments.push({
    id: uid(), videoId, authorId: State.user.discordId,
    name: State.user.channelName, avatar: State.user.avatar,
    text, createdAt: Date.now(),
  });
  await saveComments();
  render();
};

window.deleteComment = async function(id){
  State.comments = State.comments.filter(c=>c.id!==id);

};

/* ============================ ACTIONS ============================ */
window.toggleLike = async function(id){
  if(!State.user){ openLoginModal(); return; }
  const v = State.videos.find(x=>x.id===id);
  if(!v) return;
  const has = State.likes.includes(id);
  if(has){ State.likes = State.likes.filter(x=>x!==id); v.likes = Math.max(0,(v.likes||0)-1); }
  else { State.likes.push(id); v.likes = (v.likes||0)+1; }
  await saveLikes(); await saveVideos();
  render();
};

window.toggleSub = async function(){
  if(!State.user){ openLoginModal(); return; }
  if(isOwner()){ toast("C'est ta propre chaîne 🙂"); return; }
  if(State.subscribed){ State.subsList = State.subsList.filter(x=>x!==State.user.discordId); }
  else { State.subsList.push(State.user.discordId); }
  State.subscribed = !State.subscribed;
  await saveSubs();
  toast(State.subscribed? 'Abonnement ajouté ✓' : 'Désabonné');
  render();
};

window.deleteVideo = async function(id){
  if(!isOwner()) return;
  State.videos = State.videos.filter(v=>v.id!==id);
  await saveVideos();
  toast('Publication supprimée');
  render();
};

function readFileAsDataURL(file, maxMB){
  return new Promise((resolve)=>{
    if(file.size > maxMB*1024*1024){ resolve({tooBig:true, objectUrl:URL.createObjectURL(file)}); return; }
    const r = new FileReader();
    r.onload = ()=> resolve({dataUrl:r.result});
    r.onerror = ()=> resolve({error:true});
    r.readAsDataURL(file);
  });
}

function wireDropzone(dropId, inputId, onFile){
  const drop = document.getElementById(dropId);
  const input = document.getElementById(inputId);
  if(!drop||!input) return;
  input.addEventListener('change', ()=>{
    if(input.files[0]){ drop.classList.add('has-file'); drop.firstChild.textContent = '✓ ' + input.files[0].name; onFile(input.files[0]); }
  });
}

/* ============================ MODALS ============================ */
function openModal(html){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal-wrap">${html}</div>`;
  bg.addEventListener('click', (e)=>{ if(e.target===bg) closeModal(); });
  document.body.appendChild(bg);
  return bg;
}
function closeModal(){
  document.querySelectorAll('.modal-bg').forEach(el=>el.remove());
}

const DZ_AVATARS = ['🦊','🐼','🐸','🐨','🦉','🐯','🐙','🦁','🐺','🐧'];
function colorFromString(s){
  let h=0; for(let i=0;i<s.length;i++) h = s.charCodeAt(i) + ((h<<5)-h);
  return `hsl(${Math.abs(h)%360},60%,45%)`;
}
function makeAvatarDataUrl(seedText){
  const emoji = DZ_AVATARS[Math.abs(seedText.split('').reduce((a,c)=>a+c.charCodeAt(0),0))%DZ_AVATARS.length];
  const bg = colorFromString(seedText);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="${bg}"/><text x="50%" y="54%" font-size="60" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function openLoginModal(){
  const claiming = !State.profile.ownerDiscordId;
  const modal = openModal(`
    <div class="modal">
      <button class="modal-close-x" onclick="closeModal()">✕</button>
      <div style="width:44px;height:44px;border-radius:12px;background:var(--discord);display:flex;align-items:center;justify-content:center;margin-bottom:14px;">${ICONS.discord}</div>
      <h3>Connexion avec Discord</h3>
      <p class="desc">${claiming
        ? "Aucun propriétaire n'est encore associé à cette chaîne. Connecte-toi avec ton compte Discord pour la revendiquer, ou continue comme simple spectateur."
        : "Connecte-toi puis crée ta chaîne pour t'abonner, liker et commenter."}</p>
      <a class="btn btn-discord" href="/auth/discord" style="width:100%;justify-content:center;box-sizing:border-box;">${ICONS.discord} Se connecter avec Discord</a>
      <p style="color:var(--text-dim);font-size:.72rem;margin:14px 0 4px;">Fonctionne une fois <code>discord-auth</code> configuré sur Netlify (variables d'environnement + redirection Discord).</p>
      <button id="btnToggleDemo" class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:10px;font-size:.78rem;">Essayer en mode démo (sans configuration)</button>
      <div id="demoBlock" style="display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:16px;">
        <div class="field">
          <label>Pseudo Discord (simulé)</label>
          <input type="text" id="loginPseudo" placeholder="ex: DeZoX">
        </div>
        <div class="field">
          <label>Nom de ta chaîne</label>
          <input type="text" id="loginChannel" placeholder="ex: DeZoX">
        </div>
        <button class="btn btn-ghost" id="btnDoLogin" style="width:100%;justify-content:center;">Continuer en mode démo</button>
      </div>
    </div>
  `);
  modal.querySelector('#btnToggleDemo').onclick = ()=>{
    const block = modal.querySelector('#demoBlock');
    block.style.display = block.style.display==='none' ? 'block' : 'none';
  };
  const pseudoInput = modal.querySelector('#loginPseudo');
  const channelInput = modal.querySelector('#loginChannel');
  pseudoInput.addEventListener('input', ()=>{ if(!channelInput._touched) channelInput.value = pseudoInput.value; });
  channelInput.addEventListener('input', ()=>{ channelInput._touched = true; });
  modal.querySelector('#btnDoLogin').onclick = async ()=>{
    const pseudo = pseudoInput.value.trim();
    const channelName = channelInput.value.trim() || pseudo;
    if(!pseudo){ toast('Entre un pseudo Discord'); return; }
    const discordId = 'discord_' + pseudo.toLowerCase().replace(/[^a-z0-9]/g,'');
    State.user = { discordId, username: pseudo, channelName, avatar: makeAvatarDataUrl(channelName) };
    await saveUser();
    if(claiming && pseudo.toLowerCase()==='dezox'){
      State.profile.ownerDiscordId = discordId;
      State.profile.name = State.profile.name || 'DeZoX';
      await saveProfile();
      toast('Chaîne revendiquée — bienvenue DeZoX 👑');
    } else if(claiming){
      toast('Connecté en tant que spectateur');
    } else {
      toast('Chaîne créée, tu peux commenter ✓');
    }
    closeModal();
    render();
  };
}

function openChannelModal(){
  const modal = openModal(`
    <div class="modal">
      <button class="modal-close-x" onclick="closeModal()">✕</button>
      <h3>Crée ta chaîne</h3>
      <p class="desc">Ce nom sera visible sur tous tes commentaires.</p>
      <div class="field">
        <label>Nom de ta chaîne</label>
        <input type="text" id="channelNameInput" placeholder="ex: ${escapeHtml(State.user?State.user.username:'')}" value="${State.user?escapeHtml(State.user.username):''}">
      </div>
      <button class="btn btn-accent" id="btnSaveChannel" style="width:100%;justify-content:center;">Créer ma chaîne</button>
    </div>
  `);
  modal.querySelector('#btnSaveChannel').onclick = async ()=>{
    const name = modal.querySelector('#channelNameInput').value.trim();
    if(!name){ toast('Choisis un nom de chaîne'); return; }
    State.user.channelName = name;
    if(!State.user.avatar) State.user.avatar = makeAvatarDataUrl(name);
    await saveUser();
    toast('Chaîne créée ✓');
    closeModal();
    render();
  };
}

function openAccountModal(){
  const modal = openModal(`
    <div class="modal">
      <button class="modal-close-x" onclick="closeModal()">✕</button>
      <div style="text-align:center;">
        <img src="${State.user.avatar}" style="width:64px;height:64px;border-radius:50%;margin-bottom:10px;">
        <h3>${escapeHtml(State.user.username)}</h3>
        <p class="desc">${isOwner()?'Propriétaire de la chaîne':'Spectateur connecté via Discord'}</p>
      </div>
      ${isOwner()?`<button class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:10px;" onclick="closeModal();location.hash='#/dashboard'">Aller au dashboard</button>`:''}
      <button class="btn btn-danger" style="width:100%;justify-content:center;" id="btnLogout">Se déconnecter</button>
    </div>
  `);
  modal.querySelector('#btnLogout').onclick = async ()=>{
    State.user = null;
    await saveUser();
    closeModal();
    toast('Déconnecté');
    if(location.hash.startsWith('#/dashboard')||location.hash.startsWith('#/upload')) go('#/');
    render();
  };
}

/* ============================ WIRE PAGE-SPECIFIC EVENTS ============================ */
function wireDashboardEvents(){
  let pendingAvatar = null, pendingBanner = null;
  wireDropzone('dropAvatar','inputAvatar', async (f)=>{ const r = await readFileAsDataURL(f,3); pendingAvatar = r.dataUrl || r.objectUrl; });
  wireDropzone('dropBanner','inputBanner', async (f)=>{ const r = await readFileAsDataURL(f,4); pendingBanner = r.dataUrl || r.objectUrl; });
  const btn = document.getElementById('saveProfileBtn');
  if(btn) btn.onclick = async ()=>{
    State.profile.name = document.getElementById('editName').value.trim() || State.profile.name;
    State.profile.about = document.getElementById('editAbout').value.trim();
    if(pendingAvatar) State.profile.avatar = pendingAvatar;
    if(pendingBanner) State.profile.banner = pendingBanner;
    await saveProfile();
    toast('Chaîne mise à jour ✓');
    render();
  };
}

function wireUploadEvents(){
  let videoData = null, thumbData = null;
  wireDropzone('dropVideo','inputVideo', async (f)=>{ const r = await readFileAsDataURL(f,4); videoData = r.dataUrl || r.objectUrl || null; if(r.tooBig) toast('Fichier volumineux : aperçu limité à cette session'); });
  wireDropzone('dropThumb','inputThumb', async (f)=>{ const r = await readFileAsDataURL(f,2); thumbData = r.dataUrl || r.objectUrl || null; });
  const btn = document.getElementById('publishBtn');
  if(btn) btn.onclick = async ()=>{
    const title = document.getElementById('upTitle').value.trim();
    const desc = document.getElementById('upDesc').value.trim();
    if(!title){ toast('Ajoute un titre'); return; }
    const v = {
      id: uid(), type: State._uploadType||'video', title, desc,
      src: videoData||'', thumb: thumbData||'',
      views:0, likes:0, createdAt: Date.now(),
    };
    State.videos.push(v);
    await saveVideos();
    toast('Publié ✓');
    document.getElementById('upTitle').value=''; document.getElementById('upDesc').value='';
    go(v.type==='short' ? '#/shorts' : '#/watch/'+v.id);
  };
}

/* ============================ MAIN RENDER ============================ */
function render(){
  renderNav();
  renderAuthArea();
  const hash = location.hash || '#/';
  const view = document.getElementById('view');
  let html = '';
  if(hash==='#/' ) html = viewHome();
  else if(hash.startsWith('#/shorts')) html = viewShorts();
  else if(hash.startsWith('#/watch/')) html = viewWatch(hash.split('#/watch/')[1]);
  else if(hash.startsWith('#/channel')) html = viewChannel();
  else if(hash.startsWith('#/dashboard')) html = viewDashboard();
  else if(hash.startsWith('#/upload')) html = viewUpload();
  else html = viewHome();
  view.innerHTML = html;
  if(hash.startsWith('#/dashboard')) wireDashboardEvents();
  if(hash.startsWith('#/upload')) wireUploadEvents();
  window.scrollTo(0,0);
}

/* ============================ REAL DISCORD OAUTH RETURN ============================ */
async function consumeDiscordAuthFromUrl(){
  const params = new URLSearchParams(location.search);
  const raw = params.get('discordAuth');
  if(!raw) return;
  try{
    const data = JSON.parse(decodeURIComponent(raw));
    State.user = {
      discordId: data.discordId,
      username: data.username,
      avatar: data.avatar,
      channelName: (State.user && State.user.discordId===data.discordId) ? State.user.channelName : null,
    };
    await saveUser();
    if(data.isOwner && !State.profile.ownerDiscordId){
      State.profile.ownerDiscordId = data.discordId;
      State.profile.name = State.profile.name || data.username;
      await saveProfile();
      toast('Connecté avec Discord — chaîne revendiquée 👑');
    } else {
      toast('Connecté avec Discord ✓');
    }
  }catch(e){ console.error('discordAuth parse error', e); }
  history.replaceState(null, '', location.pathname + location.hash);
}

/* ============================ INIT ============================ */
(async function init(){
  await loadAll();
  await consumeDiscordAuthFromUrl();
  render();
  setTimeout(()=>{ const s = document.getElementById('splash'); if(s) s.remove(); }, 1800);
})();

})();
</script>
