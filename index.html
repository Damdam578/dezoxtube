<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>DeZoPub — propulse ton serveur Discord</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#08090d;
  --surface:#101218;
  --surface-2:#171a22;
  --surface-3:#1d212b;

  --border:#292e39;
  --border-orange:rgba(255,145,0,.35);

  --text:#f4f5f7;
  --text-dim:#8e96a6;

  --accent:#ff8a00;
  --accent-2:#ffb13b;
  --accent-dark:#c96500;

  --good:#57f287;
  --danger:#ff4d67;
  --warning:#ffc14d;

  --radius:16px;
  --radius-sm:10px;

  font-size:16px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 75% -10%,
      rgba(255,138,0,.10),
      transparent 35%
    ),
    var(--bg);

  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

h1,
h2,
h3,
.brand,
.nav-label,
.stat-num{
  font-family:'Space Grotesk',sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font-family:inherit;
  cursor:pointer;
}

img{
  max-width:100%;
  display:block;
}

::-webkit-scrollbar{
  width:8px;
  height:8px;
}

::-webkit-scrollbar-thumb{
  background:var(--surface-3);
  border-radius:999px;
}

::selection{
  background:rgba(255,138,0,.3);
}

/* ================= SPLASH ================= */

#splash{
  position:fixed;
  inset:0;
  z-index:9999;

  background:#08090d;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:10px;

  animation:splashOut .55s ease 1.1s forwards;
}

#splash .mark{
  display:flex;
  align-items:center;
  gap:10px;

  font-size:2.6rem;
  font-weight:700;

  opacity:0;
  transform:translateY(15px) scale(.94);

  animation:markIn .7s cubic-bezier(.2,.8,.2,1) .15s forwards;
}

#splash .mark span{
  color:var(--accent);
}

#splash .sub{
  color:var(--text-dim);
  font-size:.85rem;

  opacity:0;

  animation:markIn .6s ease .5s forwards;
}

#splash .loader{
  width:120px;
  height:2px;

  margin-top:14px;

  background:var(--surface-3);
  border-radius:99px;
  overflow:hidden;
}

#splash .loader span{
  display:block;
  height:100%;
  width:0;

  background:linear-gradient(
    90deg,
    var(--accent-dark),
    var(--accent),
    var(--accent-2)
  );

  animation:loader 1s ease .2s forwards;
}

@keyframes markIn{
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes loader{
  to{
    width:100%;
  }
}

@keyframes splashOut{
  to{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
}

/* ================= LAYOUT ================= */

#shell{
  display:flex;
  min-height:100vh;
}

#sidebar{
  width:245px;
  flex-shrink:0;

  position:sticky;
  top:0;

  height:100vh;

  padding:18px 14px;

  border-right:1px solid var(--border);

  background:
    linear-gradient(
      180deg,
      rgba(255,138,0,.025),
      transparent 35%
    );

  display:flex;
  flex-direction:column;
  gap:5px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;

  padding:7px 10px 22px;

  font-size:1.25rem;
  font-weight:700;
}

.brand .dot{
  width:11px;
  height:11px;

  border-radius:4px;

  background:var(--accent);

  box-shadow:
    0 0 8px rgba(255,138,0,.8),
    0 0 20px rgba(255,138,0,.35);
}

.brand-orange{
  color:var(--accent);
}

.nav-title{
  margin:17px 10px 7px;

  color:#5f6675;

  font-size:.65rem;
  font-weight:800;

  letter-spacing:.12em;
  text-transform:uppercase;
}

.navlink{
  display:flex;
  align-items:center;
  gap:12px;

  padding:11px 12px;

  border:1px solid transparent;
  border-radius:var(--radius-sm);

  color:var(--text-dim);

  font-size:.9rem;
  font-weight:600;

  transition:
    background .18s,
    color .18s,
    border-color .18s,
    transform .18s;
}

.navlink svg{
  width:19px;
  height:19px;

  flex-shrink:0;
}

.navlink:hover{
  background:rgba(255,138,0,.055);
  color:var(--text);
  transform:translateX(2px);
}

.navlink.active{
  background:
    linear-gradient(
      90deg,
      rgba(255,138,0,.15),
      rgba(255,138,0,.035)
    );

  border-color:rgba(255,138,0,.14);

  color:#fff;
}

.navlink.active svg{
  color:var(--accent);
  filter:drop-shadow(0 0 5px rgba(255,138,0,.5));
}

.navlink.moderation{
  color:#ffb14a;
}

.navlink.moderation:hover{
  background:rgba(255,138,0,.1);
}

#sidebar .spacer{
  flex:1;
}

#sidebar .foot{
  padding:10px 12px;

  color:#626979;

  font-size:.7rem;
  line-height:1.5;
}

/* ================= MAIN ================= */

#main{
  flex:1;
  min-width:0;
}

#topbar{
  position:sticky;
  top:0;

  z-index:40;

  display:flex;
  align-items:center;
  gap:14px;

  padding:12px 24px;

  background:rgba(8,9,13,.82);

  backdrop-filter:blur(16px);

  border-bottom:1px solid var(--border);
}

#topbar .search{
  flex:1;
  max-width:560px;

  display:flex;
  align-items:center;
  gap:9px;

  padding:10px 16px;

  background:var(--surface);

  border:1px solid var(--border);

  border-radius:999px;

  color:var(--text-dim);

  transition:
    border-color .2s,
    box-shadow .2s;
}

#topbar .search:focus-within{
  border-color:var(--border-orange);

  box-shadow:
    0 0 0 3px rgba(255,138,0,.05),
    0 0 20px rgba(255,138,0,.05);
}

#topbar .search input{
  width:100%;

  background:none;
  border:none;
  outline:none;

  color:var(--text);

  font-size:.88rem;
}

#topbar .search input::placeholder{
  color:#626a79;
}

#topbar .spacer{
  flex:1;
}

#authArea{
  display:flex;
  align-items:center;
}

#view{
  width:100%;
  max-width:1350px;

  padding:28px 28px 100px;
}

#view h2.section-title{
  margin:0 0 18px;

  font-size:1.2rem;
  font-weight:700;
}

/* ================= BUTTONS ================= */

.btn{
  border:1px solid transparent;
  border-radius:999px;

  padding:9px 17px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  font-size:.82rem;
  font-weight:700;

  transition:
    transform .15s,
    filter .15s,
    background .15s,
    border-color .15s,
    box-shadow .15s;
}

.btn:active{
  transform:scale(.96);
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none;
}

.btn-accent{
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent-2)
    );

  color:#171008;

  box-shadow:
    0 5px 20px rgba(255,138,0,.15);
}

.btn-accent:hover{
  filter:brightness(1.08);

  box-shadow:
    0 7px 25px rgba(255,138,0,.22);
}

.btn-bump{
  background:
    linear-gradient(
      135deg,
      #ff8700,
      #ffc04d
    );

  color:#1b1104;
}

.btn-bump:hover{
  filter:brightness(1.07);
}

.btn-ghost{
  background:var(--surface-2);

  border-color:var(--border);

  color:var(--text);
}

.btn-ghost:hover{
  border-color:#3a404e;
  background:var(--surface-3);
}

.btn-discord{
  background:#5865f2;
  color:#fff;
}

.btn-discord:hover{
  filter:brightness(1.1);
}

.btn-danger{
  background:rgba(255,77,103,.06);

  border-color:rgba(255,77,103,.28);

  color:var(--danger);
}

.btn-danger:hover{
  background:rgba(255,77,103,.13);
  border-color:rgba(255,77,103,.5);
}

.btn-warning{
  background:rgba(255,193,77,.08);

  border-color:rgba(255,193,77,.3);

  color:var(--warning);
}

/* ================= USER ================= */

.avatar{
  border-radius:50%;
  object-fit:cover;

  background:var(--surface-2);
}

.userchip{
  display:flex;
  align-items:center;
  gap:9px;

  padding:5px 12px 5px 6px;

  border:1px solid var(--border);
  border-radius:999px;

  background:var(--surface);

  cursor:pointer;

  transition:
    border-color .2s,
    background .2s;
}

.userchip:hover{
  border-color:var(--border-orange);
  background:var(--surface-2);
}

.userchip span{
  max-width:150px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  font-size:.8rem;
  font-weight:700;
}

/* ================= HOME ================= */

.hero{
  position:relative;

  margin-bottom:24px;

  padding:28px;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(255,138,0,.13),
      transparent 35%
    ),
    var(--surface);

  border:1px solid var(--border);
  border-radius:20px;
}

.hero::after{
  content:"";

  position:absolute;

  right:-90px;
  top:-90px;

  width:220px;
  height:220px;

  border-radius:50%;

  border:1px solid rgba(255,138,0,.12);

  box-shadow:
    0 0 0 30px rgba(255,138,0,.02),
    0 0 0 60px rgba(255,138,0,.015);
}

.hero h1{
  margin:0 0 8px;

  font-size:clamp(1.5rem,3vw,2.15rem);

  letter-spacing:-.04em;
}

.hero h1 span{
  color:var(--accent);
}

.hero p{
  max-width:620px;

  margin:0;

  color:var(--text-dim);

  font-size:.88rem;
  line-height:1.6;
}

/* ================= FILTERS ================= */

.sorttabs{
  display:flex;
  gap:4px;

  width:fit-content;

  margin-bottom:15px;
  padding:4px;

  background:var(--surface);

  border:1px solid var(--border);

  border-radius:999px;
}

.sorttabs button{
  border:none;

  padding:7px 15px;

  background:none;

  border-radius:999px;

  color:var(--text-dim);

  font-size:.76rem;
  font-weight:700;
}

.sorttabs button.active{
  background:var(--surface-3);
  color:var(--text);
}

.sorttabs button:hover{
  color:var(--text);
}

.chiprow{
  display:flex;
  flex-wrap:wrap;
  gap:7px;

  margin-bottom:20px;
}

.chip{
  padding:7px 13px;

  background:var(--surface);

  border:1px solid var(--border);

  border-radius:999px;

  color:var(--text-dim);

  font-size:.73rem;
  font-weight:700;

  transition:.15s;
}

.chip:hover{
  color:var(--text);
  border-color:rgba(255,138,0,.35);
}

.chip.active{
  background:rgba(255,138,0,.12);
  border-color:rgba(255,138,0,.35);
  color:#ffb14a;
}

/* ================= SERVER CARDS ================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(275px,1fr));

  gap:15px;
}

.scard{
  position:relative;

  padding:17px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.015),
      transparent
    ),
    var(--surface);

  border:1px solid var(--border);

  border-radius:var(--radius);

  cursor:pointer;

  opacity:0;

  transform:translateY(10px);

  animation:cardIn .4s ease forwards;

  transition:
    border-color .2s,
    transform .2s,
    box-shadow .2s;
}

@keyframes cardIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.scard:hover{
  border-color:rgba(255,138,0,.3);

  transform:translateY(-3px);

  box-shadow:
    0 12px 35px rgba(0,0,0,.25),
    0 0 25px rgba(255,138,0,.035);
}

.scard .head{
  display:flex;
  align-items:center;
  gap:12px;

  margin-bottom:11px;
}

.scard .icon{
  width:52px;
  height:52px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  object-fit:cover;

  background:
    linear-gradient(
      135deg,
      var(--accent-dark),
      var(--accent)
    );

  color:#fff;

  font-size:1.15rem;
  font-weight:800;
}

.scard .name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  font-size:.96rem;
  font-weight:800;
}

.scard .members{
  display:flex;
  align-items:center;
  gap:5px;

  margin-top:3px;

  color:var(--text-dim);

  font-size:.7rem;
}

.scard .members .dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--good);
}

.scard .desc{
  display:-webkit-box;

  min-height:2.4em;

  margin:0 0 12px;

  overflow:hidden;

  color:#c6ccd6;

  font-size:.79rem;
  line-height:1.5;

  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.scard .tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;

  min-height:24px;

  margin-bottom:12px;
}

.tagpill{
  padding:4px 8px;

  background:rgba(255,138,0,.08);

  border:1px solid rgba(255,138,0,.14);

  border-radius:999px;

  color:#ffb14a;

  font-size:.61rem;
  font-weight:800;

  letter-spacing:.02em;
}

.scard .foot{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding-top:12px;

  border-top:1px solid var(--border);
}

.bump-time{
  display:flex;
  align-items:center;
  gap:5px;

  color:var(--text-dim);

  font-size:.68rem;
}

.bump-time.fresh{
  color:var(--accent);
  font-weight:700;
}

.vote-btn{
  display:flex;
  align-items:center;
  gap:5px;

  padding:5px 8px;

  background:none;
  border:none;

  color:var(--text-dim);

  font-size:.76rem;
  font-weight:800;

  border-radius:8px;
}

.vote-btn:hover{
  background:rgba(255,255,255,.04);
}

.vote-btn.voted{
  color:var(--good);
}

.vote-btn svg{
  width:16px;
  height:16px;
}

/* ================= EMPTY ================= */

.empty{
  padding:80px 20px;

  text-align:center;

  color:var(--text-dim);
}

.empty .big{
  margin-bottom:8px;

  font-size:2.4rem;
}

.empty h3{
  margin:0 0 6px;

  color:var(--text);

  font-size:1rem;
}

.empty p{
  margin:0;

  font-size:.8rem;
}

/* ================= DETAIL ================= */

.detail-wrap{
  max-width:800px;
}

.detail-banner{
  width:100%;

  aspect-ratio:5/1.35;

  min-height:120px;

  position:relative;

  overflow:hidden;

  border-radius:var(--radius);

  background-size:cover;
  background-position:center;
}

.detail-head{
  display:flex;
  align-items:flex-end;
  gap:17px;

  margin:-38px 0 18px 22px;

  position:relative;
  z-index:2;
}

.detail-head .icon{
  width:88px;
  height:88px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:4px solid var(--bg);

  border-radius:50%;

  object-fit:cover;

  background:
    linear-gradient(
      135deg,
      var(--accent-dark),
      var(--accent)
    );

  color:#fff;

  font-size:1.8rem;
  font-weight:800;
}

.detail-head h2{
  margin:0 0 3px;

  font-size:1.45rem;
}

.detail-head .sub{
  color:var(--text-dim);
  font-size:.78rem;
}

.detail-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;

  margin:0 0 18px 22px;
}

.detail-tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;

  margin-bottom:18px;
}

.desc-box{
  margin-bottom:20px;
  padding:17px 19px;

  background:var(--surface);

  border:1px solid var(--border);

  border-radius:var(--radius);

  color:#cdd2dc;

  font-size:.85rem;
  line-height:1.65;

  white-space:pre-wrap;
}

.stat-inline{
  display:flex;
  flex-wrap:wrap;
  gap:30px;

  margin-bottom:20px;
}

.stat-inline .s{
  display:flex;
  flex-direction:column;
}

.stat-inline .s b{
  font-family:'Space Grotesk',sans-serif;
  font-size:1.25rem;
}

.stat-inline .s span{
  color:var(--text-dim);
  font-size:.68rem;
}

/* ================= COMMENTS ================= */

.comments-head{
  margin:12px 0 15px;

  font-size:.95rem;
  font-weight:800;
}

.comment-box{
  display:flex;
  align-items:flex-start;
  gap:12px;

  margin-bottom:22px;
}

.comment-box img,
.comment-item img{
  width:38px;
  height:38px;

  flex-shrink:0;

  border-radius:50%;

  background:var(--surface-2);
}

.comment-box .field-wrap{
  flex:1;
}

.comment-box textarea{
  width:100%;

  padding:6px 0;

  resize:none;

  background:transparent;

  border:none;
  border-bottom:1px solid var(--border);

  outline:none;

  color:var(--text);

  font-family:inherit;
  font-size:.84rem;
}

.comment-box textarea:focus{
  border-color:var(--accent);
}

.comment-box .actions{
  display:flex;
  justify-content:flex-end;

  margin-top:8px;
}

.comment-item{
  display:flex;
  gap:12px;

  margin-bottom:18px;
}

.comment-item .c-name{
  margin-right:8px;

  font-size:.8rem;
  font-weight:800;
}

.comment-item .c-time{
  color:var(--text-dim);
  font-size:.68rem;
}

.comment-item .c-text{
  margin-top:4px;

  color:#dfe3e9;

  font-size:.83rem;
  line-height:1.5;

  white-space:pre-wrap;
}

.comment-item .c-del{
  margin-top:5px;
  padding:0;

  background:none;
  border:none;

  color:var(--text-dim);

  font-size:.68rem;
}

.comment-item .c-del:hover{
  color:var(--danger);
}

.no-channel-notice{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;

  margin-bottom:20px;
  padding:12px 15px;

  background:var(--surface);

  border:1px solid var(--border);

  border-radius:var(--radius-sm);

  color:var(--text-dim);

  font-size:.8rem;
}

/* ================= PANELS ================= */

.panel{
  max-width:650px;

  margin-bottom:18px;
  padding:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.015),
      transparent
    ),
    var(--surface);

  border:1px solid var(--border);

  border-radius:var(--radius);

  box-shadow:
    0 8px 30px rgba(0,0,0,.12);
}

.panel.full{
  max-width:none;
}

.panel h3{
  margin:0 0 6px;

  font-size:1rem;
}

.panel .hint{
  margin:0 0 16px;

  color:var(--text-dim);

  font-size:.77rem;
  line-height:1.5;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;

  margin-bottom:6px;

  color:var(--text-dim);

  font-size:.75rem;
  font-weight:700;
}

.field input,
.field textarea,
.field select{
  width:100%;

  padding:10px 12px;

  background:var(--surface-2);

  border:1px solid var(--border);

  border-radius:var(--radius-sm);

  outline:none;

  color:var(--text);

  font-family:inherit;
  font-size:.84rem;

  transition:border-color .15s;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:rgba(255,138,0,.5);
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.guild-pick{
  display:flex;
  flex-direction:column;
  gap:8px;

  max-height:270px;

  overflow-y:auto;
}

.guild-opt{
  display:flex;
  align-items:center;
  gap:10px;

  padding:9px 12px;

async function apiGet(action="public"){

  const response = await fetch(
    "/api/storage?action=" +
    encodeURIComponent(action),
    {
      method:"GET",
      credentials:"include",
      cache:"no-store"
    }
  );

  const data = await response.json();

  if(!response.ok){
    throw new Error(
      data.error || "Erreur serveur"
    );
  }

  return data;
}

async function apiPost(action, payload={}){

  const response = await fetch(
    "/api/storage",
    {
      method:"POST",
      credentials:"include",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        action,
        ...payload
      })
    }
  );

  const data = await response.json();

  if(!response.ok){
    throw new Error(
      data.error || "Erreur serveur"
    );
  }

  return data;
}

/* ============================================================

function toast(message){

  const element =
    document.getElementById("toast");

  const text =
    document.getElementById("toastMsg");

  text.textContent = message;

  element.classList.add("show");

  clearTimeout(element._timer);

  element._timer =
    setTimeout(
      () => element.classList.remove("show"),
      2800
    );
}

function escapeHtml(value){

  const div =
    document.createElement("div");

  div.textContent =
    value == null ? "" : String(value);

  return div.innerHTML;
}

function fmtNum(number){

  number =
    Number(number) || 0;

  if(number >= 1000000)
    return (
      number / 1000000
    ).toFixed(1)
    .replace(".0","") + "M";

  if(number >= 1000)
    return (
      number / 1000
    ).toFixed(1)
    .replace(".0","") + "k";

  return String(number);
}

function timeAgo(timestamp){

  const seconds =
    Math.floor(
      (Date.now() - Number(timestamp || Date.now()))
      / 1000
    );

  if(seconds < 60)
    return "à l'instant";

  if(seconds < 3600)
    return Math.floor(seconds / 60) + " min";

  if(seconds < 86400)
    return Math.floor(seconds / 3600) + " h";

  if(seconds < 2592000)
    return Math.floor(seconds / 86400) + " j";

  return Math.floor(seconds / 2592000) + " mois";
}

function fmtDuration(milliseconds){

  const ms =
    Number(milliseconds) || 0;

  if(ms <= 0)
    return "disponible";

  const hours =
    Math.floor(ms / 3600000);

  const minutes =
    Math.floor(
      (ms % 3600000) / 60000
    );

  if(hours > 0){

    return (
      hours +
      "h" +
      (minutes > 0
        ? " " + minutes + "min"
        : "")
    );
  }

  return minutes + " min";
}

function initials(name){

  return (
    String(name || "?")
      .trim()
      .slice(0,2)
      .toUpperCase()
  );
}

function colorFromString(value){

  let hash = 0;

  const text =
    String(value || "");

  for(let i=0;i<text.length;i++){

    hash =
      text.charCodeAt(i) +
      ((hash << 5) - hash);
  }

  return `hsl(${Math.abs(hash)%360},65%,50%)`;
}

/* ============================================================
   AD NORMALIZER
============================================================ */

function normalizeAd(ad){

  if(!ad)
    return null;

  return {

    ...ad,

    guildName:
      ad.guildName ||
      ad.name ||
      "Serveur Discord",

    guildIcon:
      ad.guildIcon ||

    description:

    inviteLink:

    memberCount:

    lastBumpAt:

}

async function loadAll(){

    const data =
      await apiGet("public");

    State.ads =

    State.votes =
      data.votes &&
      typeof data.votes === "object"
        ? data.votes
        : {};

    State.user =

function renderNav(){

  const route =
    location.hash || "#/";

  const items =
    navItems();

  const nav =
    document.getElementById(
      "navlinks"
    );

  nav.innerHTML =
    items.map(item => {

      if(item.section){

        return `
          <div class="nav-title">
            ${item.label}
          </div>
        `;
      }

      const active =
        item.href === "#/"
          ? (
              route === "#/" ||
              route === ""
            )
          : route.startsWith(
              item.href
            );

      return `
        <a
          class="
            navlink
            ${active ? "active" : ""}
            ${item.moderation ? "moderation" : ""}
          "
          href="${item.href}"
        >
          ${ICONS[item.icon]}
          <span class="nav-label">
            ${item.label}
          </span>
        </a>
      `;

    }).join("");

  const bottom =
    document.getElementById(
      "bottomnav"
    );

  const mobileItems =
    items.filter(
      item =>
        !item.section
    );

  bottom.innerHTML =
    mobileItems
      .slice(0,5)
      .map(item => {

        const active =
          item.href === "#/"
            ? (
                route === "#/" ||
                route === ""
              )
            : route.startsWith(
                item.href
              );

        return `
          <a
            class="${active ? "active" : ""}"
            href="${item.href}"
          >
            ${ICONS[item.icon]}
            <span>
              ${item.label}
            </span>
          </a>
        `;

      })
      .join("");
}

function guildAvatarHtml(ad,size=52){

  const name =
    ad.guildName ||
    ad.name ||
    "Serveur";

  const icon =
    ad.guildIcon ||
    ad.icon ||
    "";

  if(icon){

    return `
      <img
        class="icon"
        src="${escapeHtml(icon)}"
        style="
          width:${size}px;
          height:${size}px;
        "
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex'
        "
      >

      <div
        class="icon"
        style="
          width:${size}px;
          height:${size}px;
          display:none;
          background:${colorFromString(name)};
        "
      >
        ${initials(name)}
      </div>
    `;
  }

  return `
    <div
      class="icon"
      style="
        width:${size}px;
        height:${size}px;
        background:${colorFromString(name)};
      "
    >
      ${initials(name)}
    </div>
  `;
}

function hasVoted(adId){

  const voters =
    State.votes &&
    State.votes[adId];

  if(!Array.isArray(voters))
    return false;

  return !!(
    State.user &&
    voters.includes(
      State.user.discordId
    )
  );
}

function myGuildAds(guildId){

  return State.ads.find(
    ad =>
      String(ad.guildId) ===
      String(guildId) &&
      State.user &&
      ad.authorDiscordId ===
      State.user.discordId
  );
}

function cooldownRemaining(guildId){

  const ad =
    myGuildAds(guildId);

  if(!ad)
    return 0;

  return Math.max(
    0,
    COOLDOWN_MS -
    (
      Date.now() -
      ad.lastBumpAt
    )
  );
}
/* ============================================================
   CARD PUB
============================================================ */

function adCard(ad,index=0){

  const voted =
    hasVoted(ad.id);

  const fresh =
    Date.now() -
    ad.lastBumpAt <
    60 * 60 * 1000;

  const tags =
    (ad.tags || [])
      .slice(0,4)
      .map(tag => `
        <span class="tagpill">
          ${escapeHtml(tag)}
        </span>
      `)
      .join("");

  return `
    <article
      class="scard"
      style="animation-delay:${Math.min(index * 35,500)}ms"
      onclick="openAd('${escapeHtml(ad.id)}')"
    >

      <div class="head">

        ${guildAvatarHtml(ad,52)}

        <div style="min-width:0;flex:1">

          <div class="name">
            ${escapeHtml(ad.guildName)}
          </div>

          <div class="members">

            <span class="dot"></span>

            ${
              ad.memberCount != null
                ? `${fmtNum(ad.memberCount)} membres`
                : "Serveur Discord"
            }

          </div>

        </div>

      </div>

      <p class="desc">
        ${escapeHtml(ad.description)}
      </p>

      <div class="tags">
        ${tags}
      </div>

      <div class="foot">

        <div
          class="
            bump-time
            ${fresh ? "fresh" : ""}
          "
        >
          ${ICONS.arrow}
          ${timeAgo(ad.lastBumpAt)}
        </div>

        <button
          class="
            vote-btn
            ${voted ? "voted" : ""}
          "
          onclick="
            event.stopPropagation();
            toggleVote('${escapeHtml(ad.id)}')
          "
          title="J'aime"
        >
          <svg
            viewBox="0 0 24 24"
            fill="${voted ? "currentColor" : "none"}"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M7 10v10H4V10h3z"/>
            <path d="M7 10l4-7c1.3.1 2 1 2 2v4h5.5c1.1 0 1.8 1 1.5 2l-1.5 7c-.2.9-1 1.5-1.9 1.5H7"/>
          </svg>

          ${fmtNum(ad.votes)}
        </button>

      </div>

    </article>
  `;
}

function viewHome(){

  let ads =
    State.ads.map(normalizeAd);

  const search =
    State._search
      .trim()
      .toLowerCase();

  if(search){

    ads =
      ads.filter(ad => {

        const text = [
          ad.guildName,
          ad.description,
          ad.authorName,
          ...(ad.tags || [])
        ]
          .join(" ")
          .toLowerCase();

        return text.includes(search);
      });
  }

  if(State._tagFilter){

    ads =
      ads.filter(ad =>
        (ad.tags || [])
          .includes(
            State._tagFilter
          )

      (a,b) =>
        Number(b.votes || 0) -
        Number(a.votes || 0)

function renderBanRow(ban){

  const permanent =
    !ban.expiresAt;

  const remaining =
    permanent
      ? null
      : Math.max(
          0,
          Number(ban.expiresAt) -
          Date.now()
        );

  const expired =
    !permanent &&
    remaining <= 0;

  return `
    <div class="ban-card">

      <div
        class="ban-status"
        style="${
          expired
            ? "color:var(--good);background:rgba(87,242,135,.08)"
            : ""
        }"
      >
        ${
          expired
            ? "EXPIRÉ"
            : permanent
              ? "PERMANENT"
              : "ACTIF"
        }
      </div>

      <div class="ban-info">

        <div class="id">
          ${escapeHtml(
            ban.discordId
          )}
        </div>

        <div class="reason">
          ${
            escapeHtml(
              ban.reason ||
              "Aucune raison"
            )
          }

          ·

          ${
            permanent
              ? "Permanent"
              : expired
                ? "Terminé"
                : `reste ${fmtDuration(
                    remaining
                  )}`
          }
        </div>

      </div>

      ${
        !expired
          ? `
            <button
              class="btn btn-ghost"
              onclick="
                unbanUser(
                  '${escapeHtml(
                    ban.discordId
                  )}'
                )
              "
            >
              Débannir
            </button>
          `
          : ""
      }

    </div>
  `;
}

async function confirmBan(discordId){

  const duration =
    document.getElementById(
      "banDuration"
    )?.value;

  const reason =
    document.getElementById(
      "banReason"
    )?.value
    ?.trim();

  try{

    await apiPost(
      "ban",
      {
        discordId,
        duration,
        reason
      }
    );

    document.getElementById(
      "banModal"
    )?.remove();

    toast(
      "Utilisateur banni ✓"
    );

    await loadModeration();

    render();

  }catch(error){

    toast(
      error.message ||
      "Impossible de bannir cet utilisateur"
    );
  }
}


async function unbanUser(discordId){

  if(
    !confirm(
      "Voulez-vous vraiment débannir cet utilisateur ?"
    )
  ){
    return;
  }

  try{

    await apiPost(
      "unban",
      {
        discordId
      }
    );

    toast(
      "Utilisateur débanni ✓"
    );

    await loadModeration();

    render();

  }catch(error){

    toast(
      error.message ||
      "Impossible de débannir cet utilisateur"
    );
  }
}


async function moderatorDeleteAd(id){

  if(
    !confirm(
      "Supprimer définitivement cette publication ?"
    )
  ){
    return;
  }

  try{

    await apiPost(
      "deleteAd",
      {
        id
      }
    );

    State.ads =
      State.ads.filter(
        ad =>
          String(ad.id) !==
          String(id)
      );

    toast(
      "Publication supprimée ✓"
    );

    await loadModeration();

    render();

  }catch(error){

    toast(
      error.message ||
      "Impossible de supprimer la publication"
    );
  }
}


/* ============================================================
   API
============================================================ */

async function apiGet(action){

  const response =
    await fetch(
      `/api/storage?action=${encodeURIComponent(
        action
      )}`,
      {
        method:"GET",
        credentials:"include",
        headers:{
          "Accept":
            "application/json"
        }
      }
    );

  const data =
    await response.json()
      .catch(() => ({}));

  if(!response.ok){

    throw new Error(
      data.error ||
      "Erreur serveur"
    );
  }

  return data;
}


async function apiPost(action,payload={}){

  const response =
    await fetch(
      "/api/storage",
      {
        method:"POST",
        credentials:"include",
        headers:{
          "Content-Type":
            "application/json",
          "Accept":
            "application/json"
        },
        body:JSON.stringify({
          action,
          ...payload
        })
      }
    );

  const data =
    await response.json()
      .catch(() => ({}));

  if(!response.ok){

    throw new Error(
      data.error ||
      "Erreur serveur"
    );
  }

  return data;
}

   HELPERS
============================================================ */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


function fmtNum(value){

  const n =
    Number(value || 0);

  return n.toLocaleString(
    "fr-FR"
  );
}


function timeAgo(timestamp){

  const time =
    Number(timestamp || 0);

  if(!time)
    return "jamais";

  const diff =
    Math.max(
      0,
      Date.now() - time
    );

  const sec =
    Math.floor(diff / 1000);

  if(sec < 60)
    return "à l'instant";

  const min =
    Math.floor(sec / 60);

  if(min < 60)
    return `il y a ${min} min`;

  const hours =
    Math.floor(min / 60);

  if(hours < 24)
    return `il y a ${hours} h`;

  const days =
    Math.floor(hours / 24);

  if(days < 30)
    return `il y a ${days} j`;

  return new Date(time)
    .toLocaleDateString(
      "fr-FR"
    );
}


function fmtDuration(ms){

  ms =
    Math.max(
      0,
      Number(ms || 0)
    );

  const totalSeconds =
    Math.ceil(ms / 1000);

  const days =
    Math.floor(
      totalSeconds / 86400
    );

  const hours =
    Math.floor(
      (totalSeconds % 86400) /
      3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) /
      60
    );

  if(days)
    return `${days}j ${hours}h`;

  if(hours)
    return `${hours}h ${minutes}min`;

  return `${minutes}min`;
}


function initials(name){

  return String(
    name || "?"
  )
  .split(/\s+/)
  .slice(0,2)
  .map(
    part =>
      part.charAt(0)
  )
  .join("")
  .toUpperCase();
}


function colorFromString(value){

  let hash = 0;

  for(
    let i=0;
    i<String(value).length;
    i++
  ){

    hash =
      String(value)
        .charCodeAt(i) +
      ((hash << 5) - hash);
  }

  const hue =
    Math.abs(hash) % 360;

  return `hsl(${hue},65%,45%)`;
}


function guildAvatarHtml(ad,size=48){

  const src =
    ad.icon ||
    ad.guildIcon ||
    "";

  if(src){

    return `
      <img
        class="guild-avatar"
        style="
          width:${size}px;
          height:${size}px;
        "
        src="${escapeHtml(src)}"
        alt=""
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex'
        "
      >

      <div
        class="guild-avatar fallback"
        style="
          width:${size}px;
          height:${size}px;
          display:none;
        "
      >
        ${initials(ad.guildName)}
      </div>
    `;
  }

  return `
    <div
      class="guild-avatar fallback"
      style="
        width:${size}px;
        height:${size}px;
        background:${colorFromString(
          ad.guildName
        )};
      "
    >
      ${initials(ad.guildName)}
    </div>
  `;
}

async function savePublication(
  guildId,
  existingId=null
){

  if(!State.user){

    toast(
      "Connecte-toi avec Discord"
    );

    return;
  }

  const description =
    document.getElementById(
      "pubDescription"
    )?.value
    ?.trim();

  const inviteLink =
    document.getElementById(
      "pubInvite"
    )?.value
    ?.trim();

  const memberInput =
    document.getElementById(
      "pubMembers"
    )?.value;

  const memberCount =
    memberInput === ""
      ? null
      : Number(memberInput);

  const tags =
    [...document.querySelectorAll(
      "#pubTags .chip.active"
    )]
    .map(
      element =>
        element.textContent.trim()
    );

  if(!description){

    toast(
      "Ajoute une description"
    );

    return;
  }

  if(
    inviteLink &&
    !/^https:\/\/(discord\.gg|discord\.com\/invite)\//i
      .test(inviteLink)
  ){

    toast(
      "Lien Discord invalide"
    );

    return;
  }

  try{

    const result =
      await apiPost(
        existingId
          ? "updateAd"
          : "createAd",
        {
          id: existingId,
          guildId,
          description,
          inviteLink,
          memberCount,
          tags
        }
      );

    if(result.ad){

      const index =
        State.ads.findIndex(
          ad =>
            String(ad.id) ===
            String(result.ad.id)
        );

      if(index >= 0)
        State.ads[index] =
          result.ad;
      else
        State.ads.push(
          result.ad
        );
    }

    toast(
      existingId
        ? "Publication modifiée ✓"
        : "Publication créée ✓"
    );

    go("#/mes-pubs");

  }catch(error){

    toast(
      error.message ||
      "Impossible d'enregistrer la publication"
    );
  }
}


async function deleteAd(id){

  const ad =
    State.ads.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if(!ad)
    return;

  if(
    !confirm(
      `Supprimer la publication de "${ad.guildName}" ?`
    )
  ){

    return;
  }

  try{

    await apiPost(
      "deleteAd",
      {
        id
      }
    );

    State.ads =
      State.ads.filter(
        item =>
          String(item.id) !==
          String(id)
      );

    toast(
      "Publication supprimée ✓"
    );

    go("#/mes-pubs");

  }catch(error){

    toast(
      error.message ||
      "Suppression impossible"
    );
  }
}


function editAd(id){

  const ad =
    State.ads.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if(!ad){

    toast(
      "Publication introuvable"
    );

    return;
  }

  if(
    !State.user ||
    ad.authorDiscordId !==
    State.user.discordId
  ){

    toast(
      "Tu ne peux modifier que tes publications"
    );

    return;
  }

  State._selectedGuild =
    ad.guildId;

  go("#/publier");
}


async function toggleVote(id){

  try{

    const result =
      await apiPost(
        "vote",
        {
          adId:id
        }
      );

    const ad =
      State.ads.find(
        item =>
          String(item.id) ===
          String(id)
      );

    if(ad){

      ad.votes =
        Number(
          result.votes ??
          ad.votes ??
          0
        );
    }

    if(result.voted !== undefined){

      if(!State._voted)
        State._voted = {};

      State._voted[id] =
        result.voted;
    }

    render();

  }catch(error){

    toast(
      error.message ||
      "Impossible de voter"
    );
  }
}


function hasVoted(id){

  return !!(
    State._voted &&
    State._voted[id]
  );
}

/* ============================================================
   ROUTER
============================================================ */

function route(){

  const hash =
    location.hash || "#/";

  if(
    hash === "#/" ||
    hash === "#"
  ){

    viewHome();

  }else if(
    hash === "#/publier"
  ){

    viewPublish();

  }else if(
    hash === "#/mes-pubs"
  ){

    viewMyAds();

  }else if(
    hash === "#/moderation"
  ){

    viewModeration();

  }else if(
    hash === "#/moderation/pubs"
  ){

    viewModerationAds();

  }else if(
    hash === "#/moderation/bans"
  ){

    viewModerationBans();

  }else if(
    hash === "#/moderation/stats"
  ){

    viewModerationStats();

  }else if(
    hash === "#/moderation/logs"
  ){

    viewModerationLogs();

  }else if(
    hash.startsWith("#/pub/")
  ){

    const id =
      decodeURIComponent(
        hash.slice(6)
      );

    viewDetail(id);

  }else{

    go("#/");

  }

  injectModerationNav();
}


window.addEventListener(
  "hashchange",
  route
);

(async function init(){

  try{

    if(
      typeof loadAll ===
      "function"
    ){

      await loadAll();

    }

  }catch(error){

    console.error(
      "loadAll error:",
      error
    );
  }

  try{

    const me =
      await apiGet("me");

    if(me.authenticated && me.user){
      State.user = me.user;
    }else{
      State.user = null;
    }

  }catch(error){

    console.error(
      "Session Discord error:",
      error
    );

    State.user = null;
  }

  /*
   * Les annonces sont maintenant
   * récupérées depuis le serveur.
   */

  try{

    const data =
      await apiGet("public");

    if(data.ads)
      State.ads =
        data.ads;

    if(data.comments)
      State.comments =
        data.comments;

  }catch(error){

    console.warn(
      "API publique indisponible:",
      error
    );
  }

  route();

})();


/* ============================================================
   REFRESH AUTOMATIQUE
============================================================ */

setInterval(
  async () => {

    try{

      const data =
        await apiGet("public");

      if(data.ads)
        State.ads =
          data.ads;

      if(data.comments)
        State.comments =
          data.comments;

      /*
       * On ne force pas un re-render
       * lorsqu'un champ est actuellement
       * en train d'être édité.
       */

      if(
        !document.activeElement ||
        ![
          "INPUT",
          "TEXTAREA",
          "SELECT"
        ].includes(
          document.activeElement.tagName
        )
      ){

        route();

      }

    }catch(error){

      console.warn(
        "Refresh API:",
        error
      );
    }

  },
  30000
);
